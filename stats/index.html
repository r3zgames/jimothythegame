<style>
/* The Sightings Office (docs/STATS_OFFICE.md). Chrome in the game's UI kit
   (ink plates, gold = yours/active, teal = pressable); records on the
   corkboard's papers (tools/stats_board/DESIGN.md colour and type roles). */
:root{
  --ink:#23202E; --ink-2:#2E2A3C; --ink-3:#3A3550; --cream:#F4EFE6; --gold:#F2C230; --teal:#17766F; --teal-hi:#3FC1B3;
  --danger:#E5484D; --plum:#221834; --focus:#FFD34D; --muted:#BDB6CC; --night:#141220;
  --parchment:#f1e8d0; --paper-ink:#1b1e2b; --paper-soft:#3a3d4a; --navy:#1d2c4c; --structure:#3a2615; --secondary:#4c6a88; --alert:#b3241b; --interactive:#17766f;
  --f-stat:"Big Shoulders Display","Arial Narrow",sans-serif; --f-text:"Courier Prime","Courier New",monospace; --f-marker:"Permanent Marker","Comic Sans MS",cursive;
  --dirH:60px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--dirH) + 12px)}
body{margin:0;background:var(--night);color:var(--cream);font:400 16.5px/1.45 var(--f-text);-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none} /* headings and main take focus on arrival for screen readers; they are not controls */
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.skip{position:absolute;left:8px;top:-60px;z-index:50;background:var(--gold);color:var(--ink);padding:10px 14px;font-weight:700;border-radius:4px}
.skip:focus{top:8px}

/* ---------- directory (the lobby board) ---------- */
.dir{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;height:var(--dirH);padding:0 max(16px,env(safe-area-inset-left));
  background:var(--ink);border-bottom:2px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.45)}
.seal{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 40% 35%,#d4a645 0 30%,#8a6420 70%);border:2px solid var(--plum);box-shadow:inset 0 0 0 3px rgba(35,32,46,.35)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0;flex:none}
.title{font-family:var(--f-stat);font-weight:900;letter-spacing:.04em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title b{display:block;font-size:22px}.title small{display:block;font-size:13px;color:var(--gold);letter-spacing:.14em;margin-top:3px}
.dir nav{margin-left:auto;min-width:0}
.dir ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;overflow-x:auto;scrollbar-width:none}
.dir ul::-webkit-scrollbar{display:none}
.dir nav a{font:700 14px/1 var(--f-text);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;padding:0 9px;height:44px;display:flex;align-items:center;gap:6px;
  border:2px solid transparent;border-radius:6px;white-space:nowrap}
.dir nav a[aria-current="page"]{border-color:var(--gold);color:var(--gold);background:rgba(242,194,48,.08)}
.dir nav a:hover{border-color:var(--teal-hi)}
.dir nav a .soon{font-size:11px;color:var(--muted);letter-spacing:.04em}
.status{display:flex;align-items:center;gap:7px;font:700 12.5px/1.2 var(--f-text);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.status i{width:10px;height:10px;border-radius:50%;background:#6d6680;flex:none}
.status[data-s="live"] i{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.status[data-s="stale"] i{background:#d98a2b}
.status[data-s="sample"] i{background:var(--teal-hi)}

/* ---------- notices (failed, stale, sample, your game) ---------- */
.notice{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font:700 15px/1.35 var(--f-text);
  background:#3a2228;border-bottom:2px solid var(--danger)}
.notice[data-kind="stale"]{background:#3a3020;border-color:#d98a2b}
.notice[data-kind="sample"]{background:#1d3634;border-color:var(--teal-hi)}
.notice[data-kind="you"]{background:#352e17;border-color:var(--gold)}
.notice p{margin:0;flex:1 1 320px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:4px;border:0;cursor:pointer;
  background:var(--interactive);color:#fff;font:700 15px/1 var(--f-text);text-decoration:none;box-shadow:0 2px 0 #0d4a45}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid currentColor;color:var(--cream)}

/* ---------- overview: the section is the menu ---------- */
.view{display:none}.view.on{display:block}
.stagewrap{position:relative;max-width:1440px;margin:0 auto;overflow:hidden;height:1080px}
.stage{position:absolute;top:0;width:1440px;height:1080px}
.stage>img.art,.scene img.art{position:absolute;left:0;top:0;width:1440px;height:1080px;max-width:none}
.sprite{position:absolute;pointer-events:none;background-repeat:no-repeat;background-position:0 0;image-rendering:pixelated;image-rendering:crisp-edges;z-index:2}
.sprite.flip{transform:scaleX(-1)}
@media (prefers-reduced-motion:no-preference){.sprite.anim{animation:strip var(--t) steps(var(--n)) infinite}}
@keyframes strip{to{background-position:calc(var(--n) * var(--w) * -1) 0}}
.shadow{position:absolute;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(12,8,20,.55),rgba(12,8,20,0));pointer-events:none;z-index:1}
.beam{position:absolute;width:160px;height:90px;pointer-events:none;z-index:3;mix-blend-mode:screen;clip-path:polygon(100% 38%,0 0,0 100%,100% 52%);
  background:linear-gradient(to left,rgba(255,236,170,.55),rgba(255,236,170,.12) 70%,rgba(255,236,170,0))}
@keyframes doze{0%,62%{left:0}63%,100%{left:-59px}}
.hero-title{position:absolute;left:170px;top:20px;font-family:var(--f-stat);font-weight:900;text-transform:uppercase;letter-spacing:.05em;text-shadow:0 2px 0 var(--plum)}
.hero-title h1{margin:0;font-size:44px;line-height:1}
.hero-title p{margin:6px 0 0;font-size:17px;letter-spacing:.2em;color:var(--gold)}
.room{position:absolute;display:block;border:2px solid transparent;border-radius:2px;text-decoration:none;color:var(--cream)}
.room:hover{border-color:rgba(242,194,48,.8);box-shadow:inset 0 0 0 9999px rgba(242,194,48,.07)}
.room:focus-visible{outline-offset:-3px}
.tag{position:absolute;left:6px;top:6px;font:700 13px/1 var(--f-text);letter-spacing:.08em;text-transform:uppercase;color:var(--cream);
  background:rgba(35,32,46,.93);border:2px solid var(--gold);border-radius:4px;padding:6px 8px;white-space:nowrap}
.tag.soon{border-color:#6d6680}.tag .s{color:var(--muted);font-size:11px;margin-left:6px}
.board{background:rgba(35,32,46,.96);border:2px solid var(--gold);border-radius:10px;padding:16px 18px 14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.stage .board{position:absolute;left:1062px;top:150px;width:356px}
.board h2{margin:0;font:900 15px/1 var(--f-stat);letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.board .status{margin:8px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;margin:0}
.kpi{border-top:1px solid rgba(244,239,230,.2);padding-top:8px;min-width:0}
.kpi dd{margin:0;font:900 40px/.9 var(--f-stat);font-variant-numeric:tabular-nums;color:var(--cream)}
.kpi dd a{text-decoration:none}.kpi dd a:hover{text-decoration:underline;text-decoration-thickness:2px}
.kpi dd.red{color:var(--danger)}
.kpi dt{font:700 12.5px/1.25 var(--f-text);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:4px;order:2}
.kpi{display:flex;flex-direction:column}
.kpi.wide{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:12px}
.kpi.wide dd{font-size:64px;color:var(--gold)}
.kpi.wide dt{order:2}
.tick{display:inline-block;font:700 12px/1 var(--f-text);background:var(--danger);color:#fff;border-radius:3px;padding:3px 6px;margin-left:6px;vertical-align:middle;letter-spacing:.04em}
.board .more{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;font:700 14px/1 var(--f-text);letter-spacing:.06em;text-transform:uppercase;color:var(--teal-hi);text-decoration:none}
.board .more:hover{text-decoration:underline}
.note{position:absolute;font:20px/1.1 var(--f-marker);color:var(--cream);transform:rotate(-3deg);text-shadow:0 2px 0 var(--plum);pointer-events:none}
.belowboard{display:none;max-width:1440px;margin:0 auto;padding:16px}
.ovphone{display:none}
/* mid widths: crop to the building, the board under the art */
@media (max-width:1439px){.stage .board{display:none}.belowboard{display:block}.belowboard .board{max-width:640px}}
@media (max-width:599px){
  .stagewrap,.belowboard{display:none}.ovphone{display:block}
  :root{--dirH:56px}.dir{gap:10px;padding:0 12px}.title b{font-size:17px}.title small{font-size:11px}
}

/* ---------- phone directory (sticky pills) ---------- */
.pdir{display:none}
@media (max-width:1099px){
  .dir nav{display:none}
  .pdir{display:block;position:sticky;top:var(--dirH);z-index:29;background:#1b1828;border-bottom:1px solid var(--ink-3)}
  .pdir ul{display:flex;gap:6px;overflow-x:auto;list-style:none;margin:0;padding:8px 12px;scrollbar-width:none}
  .pdir ul::-webkit-scrollbar{display:none}
  .pdir a{flex:none;white-space:nowrap;gap:6px;font:700 13px/1 var(--f-text);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;height:44px;padding:0 12px;display:flex;align-items:center;border:2px solid #4a4462;border-radius:6px}
  .pdir a[aria-current="page"]{border-color:var(--gold);color:var(--gold)}
  html{scroll-padding-top:120px}
}
.crop{position:relative;display:block;overflow:hidden;background:var(--night);text-decoration:none;color:var(--cream)}
.crop img.art{position:absolute;width:1440px;height:1080px;max-width:none}
.crop .tag{left:12px;top:10px}
.pc{display:block;text-decoration:none;color:var(--cream);margin-bottom:14px;min-height:44px}
.pc p{margin:0;padding:10px 12px 4px;font:400 15px/1.4 var(--f-text)}
.pc p b{font:900 22px/1 var(--f-stat)}
.pc:hover p{text-decoration:underline}
.floor{font:900 13px/1 var(--f-stat);letter-spacing:.2em;color:var(--gold);text-transform:uppercase;padding:18px 12px 8px;margin:0}
.ovphone .board{margin:-18px 12px 0;position:relative}

/* ---------- room views ---------- */
.roomhead{max-width:1440px;margin:0 auto;padding:18px 16px 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.roomhead h1{margin:0;font:900 40px/1 var(--f-stat);letter-spacing:.04em;text-transform:uppercase}
.roomhead p{margin:0;color:var(--muted);font-size:15px}
.roomhead .back{margin-left:auto}
.scene{position:relative;max-width:1440px;margin:0 auto;overflow:hidden;background:var(--night)}
.scene .layer{position:absolute;left:0;top:0;width:1440px;height:1080px;transform-origin:0 0}
.scene .dim{position:absolute;background:rgba(14,12,24,.62);pointer-events:none}
.scene .ov{position:absolute;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .scene .layer.moving{transition:transform .24s cubic-bezier(.2,.7,.2,1)}
  .view.entering .docs{animation:rise .24s ease-out both}
}
@keyframes frame{from{opacity:.35;filter:brightness(.7)}to{opacity:1;filter:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* overlays drawn in art pixels (they scale with the art) */
.signlbl{font:700 7px/1 var(--f-text);letter-spacing:.08em;color:#e8c27a;text-align:center;text-transform:uppercase}
.signnum{font:900 52px/1 var(--f-stat);color:#ffd36b;text-shadow:0 0 6px rgba(255,180,60,.6);text-align:center;font-variant-numeric:tabular-nums}
.livelamp{width:6px;height:6px;border-radius:50%;background:#555}
.livelamp.on{background:#ff4d4d;box-shadow:0 0 6px 2px rgba(255,77,77,.8)}
.poster{background:#e9dfc4;border:1px solid #5b4a2a;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.poster b{font:900 9px/1 var(--f-stat);letter-spacing:.06em;color:#7a1a14;margin:3px 0 1px}
.poster img{width:39px;height:auto}
.plate{background:linear-gradient(#c9a24c,#8c6a22);border:1px solid #3a2a10;color:#2a1c08;font:900 6px/1 var(--f-stat);letter-spacing:.08em;display:flex;align-items:center;justify-content:center;white-space:nowrap}

/* ---------- documents (the corkboard's papers) ---------- */
.docs{max-width:1440px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.paper{grid-column:span 6;position:relative;background:var(--parchment);color:var(--paper-ink);border-radius:2px;padding:20px 22px 22px;
  box-shadow:0 2px 2px rgba(0,0,0,.35),8px 14px 12px rgba(0,0,0,.28)}
.paper.w4{grid-column:span 4}.paper.w8{grid-column:span 8}.paper.w12{grid-column:span 12}
@media (max-width:1023px){.paper,.paper.w4,.paper.w8{grid-column:span 12}}
.paper::after{content:"";position:absolute;right:0;bottom:0;border-width:0 0 16px 16px;border-style:solid;border-color:transparent transparent #d8cba8 transparent;filter:drop-shadow(-1px -1px 0 rgba(0,0,0,.15))}
.paper h2{margin:0 0 4px;font:900 26px/1.05 var(--f-stat);letter-spacing:.03em;text-transform:uppercase;color:var(--structure)}
.paper .sub{margin:0 0 14px;font-size:14.5px;color:var(--paper-soft)}
.case{font:700 13px/1 var(--f-text);letter-spacing:.12em;color:var(--alert);margin-bottom:6px;text-transform:uppercase}
.paper dl.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px 18px;margin:0}
.paper dl.facts div{border-top:2px solid rgba(58,38,21,.25);padding-top:8px;display:flex;flex-direction:column}
.paper dl.facts dd{margin:0;font:900 44px/.95 var(--f-stat);color:var(--navy);font-variant-numeric:tabular-nums}
.paper dl.facts dd.red{color:var(--alert)}
.paper dl.facts dt{order:2;font:700 13.5px/1.3 var(--f-text);letter-spacing:.04em;text-transform:uppercase;color:var(--paper-soft);margin-top:4px}
.paper dl.facts small{order:3;font-size:13.5px;color:var(--paper-soft)}
.paper a{color:var(--interactive);font-weight:700}
.paper a.btn{color:#fff}
.paper .meta{font-size:14.5px;color:var(--paper-soft);margin:12px 0 0}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bars li{display:grid;grid-template-columns:minmax(110px,9.5em) 1fr auto;align-items:center;gap:10px;font-size:15px}
.bars .bar{height:14px;background:rgba(76,106,136,.18);border-radius:2px;overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--secondary)}
.bars .bar i.alert{background:var(--alert)}
.bars b{font:900 22px/1 var(--f-stat);color:var(--navy);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.empty{margin:6px 0 0;padding:12px 14px;border:2px dashed rgba(58,38,21,.35);font-size:15px;color:var(--paper-soft)}
.small{margin:10px 0 0;font-size:14px;color:#6a4a10;background:#f6e4a6;padding:6px 10px;display:inline-block}
.stampmark{position:absolute;right:18px;top:16px;font:900 18px/1 var(--f-stat);letter-spacing:.1em;color:var(--alert);border:3px solid var(--alert);padding:4px 8px;transform:rotate(6deg);opacity:.85;mix-blend-mode:multiply}
.stampmark.teal{color:var(--interactive);border-color:var(--interactive)}
.marker{font:19px/1.15 var(--f-marker);color:var(--secondary);margin:10px 0 0}
.skel{display:inline-block;min-width:2.2ch;color:transparent!important;background:linear-gradient(90deg,rgba(29,44,76,.12),rgba(29,44,76,.22),rgba(29,44,76,.12));border-radius:3px}
.board .skel{background:rgba(244,239,230,.15)}

/* stamp rack (the corkboard's period selector, flat) */
.rack{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 0;padding:12px;background:#5a3b22;border-radius:6px;box-shadow:inset 0 -3px 0 #3d2715}
.stamp{min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding:8px 4px 7px;cursor:pointer;
  background:#7a2a22;border:0;border-radius:6px 6px 3px 3px;box-shadow:0 4px 0 #3d1510;color:#f6e9d2;font:700 14px/1 var(--f-text);letter-spacing:.06em;position:relative;top:0}
.stamp::before{content:"";width:26px;height:12px;border-radius:6px 6px 2px 2px;background:#2d1d12;box-shadow:inset 0 -3px 0 #1a100a}
.stamp[aria-pressed="true"]{top:3px;box-shadow:0 1px 0 #3d1510,inset 0 -3px 0 var(--interactive);background:#8d3127}
.stamp[aria-pressed="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:3px;background:#48d3c3}
.stamp kbd{font:700 11px/1 var(--f-text);color:#d6bfa0}
.optin{margin:14px 0 0;padding:12px 14px;border:2px solid rgba(58,38,21,.35);background:#fbf5e6}
.optin .fm{font:700 12.5px/1 var(--f-text);letter-spacing:.1em;color:var(--alert);margin-bottom:8px}
.optin label{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;font-weight:700}
.optin input{width:24px;height:24px;accent-color:var(--interactive)}
.optin small{display:block;font-weight:400;color:var(--paper-soft)}


/* ---------- Phase 3 ---------- */
.paper dl.facts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:599px){.paper dl.facts.three{grid-template-columns:1fr}}
.sharebtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;margin:4px 6px 0 0;border:2px solid var(--interactive);border-radius:4px;background:#fbf5e6;color:var(--interactive);font:700 13.5px/1 var(--f-text);letter-spacing:.04em;cursor:pointer}
.sharebtn svg{width:16px;height:16px}.sharebtn:hover{background:#e6f3f1}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btn.ghost.dark{color:var(--paper-ink);border-color:var(--paper-ink)}
.shimg{display:block;width:100%;height:auto;border:2px solid var(--structure);margin:6px 0 4px}
dialog{max-width:640px}
/* the sightings board */
.map{position:relative;margin:0 0 12px;border:3px solid var(--structure);background:#0f2733;line-height:0}
.map img{width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0;background:none;border:0;cursor:pointer}
.pin i{width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#6d6680;border:2px solid var(--plum);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.pin.hot i{background:var(--danger)}.pin.locked i{background:#9b94ad;opacity:.75}
.pin.sel i{outline:3px solid var(--gold);outline-offset:2px}
.pin span{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12.5px/1 var(--f-text);color:var(--cream);background:rgba(35,32,46,.92);border:1px solid var(--gold);border-radius:3px;padding:4px 6px;display:none}
.pin.sel span,.pin:hover span,.pin:focus-visible span{display:block}
.hoodlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.hoodlist button{width:100%;min-height:44px;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:0 10px;background:#fbf5e6;border:2px solid rgba(58,38,21,.3);border-radius:3px;cursor:pointer;font:700 14px/1.2 var(--f-text);color:var(--paper-ink)}
.hoodlist button[aria-pressed="true"]{border-color:var(--interactive);box-shadow:inset 4px 0 0 var(--interactive)}
.hoodlist .muted{font-weight:400;color:var(--paper-soft)}.hoodlist .n{color:var(--navy)}
.report{align-self:start;position:relative}
.rep{margin:0;display:grid;gap:8px}.rep div{display:grid;grid-template-columns:7.5em 1fr;gap:8px;border-top:1px solid rgba(58,38,21,.2);padding-top:6px}
.rep dt{font:700 13px/1.3 var(--f-text);letter-spacing:.06em;text-transform:uppercase;color:var(--paper-soft)}.rep dd{margin:0}
.rep b{font:900 24px/1 var(--f-stat);color:var(--navy)}.rep b.red{color:var(--alert)}
.report .stampmark{position:static;display:inline-block;margin:14px 0 6px}
.chart svg{width:100%;max-width:880px;height:auto;display:block}
.chart text{font:12px var(--f-text);fill:var(--paper-soft)}
.chart .grid{stroke:rgba(58,38,21,.15)}
.chart polyline{fill:none;stroke-width:2.5}
.chart .s0{stroke:var(--navy);fill:var(--navy)}.chart polyline.s0{fill:none}
.chart .s1{stroke:var(--secondary)}.chart .s2{stroke:var(--alert);stroke-dasharray:5 4}
.chart rect.s0{fill:var(--secondary);stroke:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font:700 13px/1 var(--f-text);margin:0 0 6px}
.legend .lg i{display:inline-block;width:18px;height:4px;margin-right:6px;vertical-align:middle;background:currentColor}
.legend .s0{color:var(--navy)}.legend .s1{color:var(--secondary)}.legend .s2{color:var(--alert)}
.chart details{margin-top:8px;font-size:14px}.chart summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--interactive)}
.chart table{border-collapse:collapse;width:100%;max-width:520px}.chart th,.chart td{text-align:left;padding:3px 8px;border-bottom:1px solid rgba(58,38,21,.15)}
/* holding */
.funnel{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.funnel .fl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.funnel .fl b{font:900 34px/1 var(--f-stat);color:var(--navy)}
.funnel .bar{display:block;height:14px;background:rgba(76,106,136,.18);margin:6px 0 4px}.funnel .bar i{display:block;height:100%;background:var(--secondary)}.funnel .bar i.alert{background:var(--alert)}
.funnel small{font-size:14px;color:var(--paper-soft)}
.yours{display:inline-block;font:700 11.5px/1 var(--f-text);letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--ink);padding:4px 6px;border-radius:3px}
.yourres{margin:14px 0 0;padding:10px 12px;background:#f6e4a6;border-left:4px solid var(--gold);font-size:15px}.yourres small{display:block;color:#6a4a10}
.lineup{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:12px}
.mugshot{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;background:#e9e3d2;border:2px solid rgba(58,38,21,.3);border-radius:3px;cursor:pointer;color:var(--paper-ink)}
.mugshot .face{width:108px;height:108px;background-image:url(a/faces.60859a9d8e.webp);background-size:972px 216px;image-rendering:pixelated;background-color:#2a2f3a}
.mugshot .st{position:absolute;top:44px;left:50%;transform:translateX(-50%) rotate(-8deg);font:900 17px/1 var(--f-stat);letter-spacing:.08em;color:var(--alert);border:3px solid var(--alert);padding:3px 6px;background:rgba(241,232,208,.85)}
.mugshot.free .st{color:var(--interactive);border-color:var(--interactive)}
.mugshot .st.later{color:#4a4462;border-color:#4a4462;font-size:15px}
.mugshot .nm{font:900 18px/1 var(--f-stat);text-transform:uppercase}
.mugshot .yours{position:absolute;top:6px;right:6px}
.cagetag{font:900 6px/1.05 var(--f-stat);letter-spacing:.06em;color:#7a1a14;background:#e9dfc4;border:1px solid #5b4a2a;padding:2px 3px;transform:rotate(-4deg)}
/* the kitchen */
.fridgenote{font:5px/1.15 var(--f-marker);color:#1b1e2b;background:#f7f3a0;padding:2px 3px;transform:rotate(3deg)}
.receipt{background:#f7f3ea;font-family:var(--f-text)}
.receipt .rh{font:900 26px/1 var(--f-stat);text-align:center;letter-spacing:.04em}
.receipt .rs{text-align:center;font-size:13.5px;letter-spacing:.1em;color:var(--paper-soft);margin:6px 0}
.rcpt{list-style:none;margin:12px 0;padding:10px 0;border-top:2px dashed rgba(27,30,43,.4);border-bottom:2px dashed rgba(27,30,43,.4);display:grid;gap:8px}
.rcpt li{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:4px 10px;font-weight:700;font-size:15px}
.rcpt b{font:900 30px/1 var(--f-stat);color:var(--navy);font-variant-numeric:tabular-nums}
.rcpt em{grid-column:1/-1;font:16px/1.1 var(--f-marker);color:var(--secondary);font-style:normal}
.rcpt .sharebtn{margin:0;min-height:44px;padding:0 8px}.rcpt .sharebtn span{display:none}
.rt{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}.rt b{font:900 36px/1 var(--f-stat)}
.souvs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.souvs a{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:44px;padding:10px;background:#fbf5e6;border:2px solid rgba(58,38,21,.25);border-radius:3px;text-decoration:none;transform:rotate(-1deg)}
.souvs li:nth-child(even) a{transform:rotate(1.2deg)}
.souvs .ico{width:60px;height:60px;background-image:url(a/trophies.c5e9b1f187.webp);image-rendering:pixelated}
.souvs span:not(.ico){font:17px/1.15 var(--f-marker);color:var(--paper-ink)}.souvs small{font-size:13px}

/* evidence: the cabinet drawers and the bags */
.drawers{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.drawers button{min-height:48px;padding:0 16px;border-radius:4px 4px 0 0;border:2px solid #8c8f99;border-bottom-width:6px;background:#b9bcc4;color:#1d2230;
  font:700 15px/1 var(--f-text);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.drawers button[aria-selected="true"]{background:#e6e8ee;border-color:var(--interactive);box-shadow:inset 0 -4px 0 var(--interactive)}
.bags{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.bag{position:relative;display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;cursor:pointer;padding:22px 14px 14px;min-height:200px;
  background:rgba(232,240,246,.72);border:2px solid rgba(120,140,160,.55);border-radius:4px;color:var(--paper-ink);box-shadow:0 2px 2px rgba(0,0,0,.18),4px 7px 7px rgba(0,0,0,.14)}
.bag::before{content:"";position:absolute;left:8px;right:8px;top:8px;height:6px;border-radius:3px;background:#c0392b;opacity:.85}
.bag:hover{transform:translateY(-2px)}
.bag .ico{width:60px;height:60px;background-image:url(a/trophies.c5e9b1f187.webp);background-repeat:no-repeat;image-rendering:pixelated;align-self:flex-start}
.bag.none .ico{filter:grayscale(1) opacity(.45)}
.bag .nm{font:900 21px/1.05 var(--f-stat);text-transform:uppercase;color:var(--structure)}
.bag .how{font-size:14px;line-height:1.35;color:var(--paper-soft)}
.bag .cnt{margin-top:auto;font:700 14.5px/1.3 var(--f-text)}
.bag .cnt b{font:900 26px/1 var(--f-stat);color:var(--navy)}
.bag .rk{font:700 12.5px/1 var(--f-text);letter-spacing:.06em;text-transform:uppercase;color:var(--alert)}
.bag .yours{position:absolute;right:10px;top:20px;font:700 11.5px/1 var(--f-text);letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--ink);padding:4px 6px;border-radius:3px}
.suspects{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.suspects li{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center}
.suspects .mug{width:60px;height:75px;background-image:url(a/suspects.e79f34fab3.webp);background-size:360px 75px;image-rendering:pixelated;border:2px solid #3a2615;background-color:#cfc6ae}
.suspects .bar{height:12px;background:rgba(179,36,27,.15);margin-top:6px}.suspects .bar i{display:block;height:100%;background:var(--alert)}
.suspects b{font:900 28px/1 var(--f-stat);color:var(--navy);font-variant-numeric:tabular-nums}
dialog{max-width:560px;width:calc(100% - 32px);border:0;padding:0;background:transparent}
dialog::backdrop{background:rgba(10,8,18,.7)}
dialog .paper{grid-column:auto}
.foot{max-width:1440px;margin:0 auto;padding:24px 16px 48px;color:var(--muted);font-size:14.5px;display:flex;flex-wrap:wrap;gap:8px 22px}
.foot a{color:var(--cream)}
</style>

/* A small line or bar chart in SVG, with the same numbers as a table under it. */
function chart(id, series, n, opts = {}) {
  const W = 640, H = 220, L = 44, R = 10, T = 12, B = 30;
  const weekly = n > 120;
  const pack = v => { if (!weekly) return v.slice(-n); const out = []; const s = v.slice(-n); for (let i = 0; i < s.length; i += 7) { const w = s.slice(i, i + 7); out.push(opts.sum ? w.reduce((a, b) => a + b, 0) : Math.round(w.reduce((a, b) => a + b, 0) / w.length * 10) / 10); } return out; };
  const S = series.map(x => Object.assign({}, x, {v: pack(x.values || [])}));
  const m = S[0].v.length; const max = Math.max(1, ...S.flatMap(x => x.v));
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = Math.max(1, [1, 2, 5, 10].map(f => f * mag).find(v => v >= raw)); const top = step * 4;
  const X = i => L + (W - L - R) * (m <= 1 ? 0.5 : i / (m - 1)), Y = v => T + (H - T - B) * (1 - v / top);
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = top * k / 4, y = Y(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="grid"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${fmtN(Math.round(v))}</text>`; }
  const every = Math.max(1, Math.ceil(m / 6));

/* ---------- share cards: the room's own art beside the number ---------- */
const imgCache = {};
const loadImg = src => imgCache[src] || (imgCache[src] = new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }));
function wrap(ctx, s, w) { const out = []; let ln = ""; for (const word of s.split(" ")) { const t = ln ? ln + " " + word : word; if (ctx.measureText(t).width > w && ln) { out.push(ln); ln = word; } else ln = t; } if (ln) out.push(ln); return out; }
async function drawCard(o) {
  try { await Promise.all(['900 200px "Big Shoulders Display"', '700 30px "Courier Prime"', '400 26px "Courier Prime"'].map(f => document.fonts.load(f))); } catch (e) {}
  const W = 1200, H = 630, cv = document.createElement("canvas"); cv.width = W; cv.height = H; const x = cv.getContext("2d");
  const art = await loadImg(ART.s2).catch(() => null); /* the 2x painting: the card shows it at 1:1 */
  const room = ROOM[o.room] || ROOM.dispatch; const fx = room.focus, fy = (room.r[1] + room.r[3]) / 2;
  x.fillStyle = "#23202E"; x.fillRect(0, 0, W, H);
  if (art) {
    const sx = Math.max(0, Math.min(1440 - 280, Math.round(fx - 140))), sy = Math.max(0, Math.min(1080 - 315, Math.round(fy - 157)));
    x.drawImage(art, sx * 2, sy * 2, 560, 630, 0, 0, 560, 630);
    /* the room's officer, pixel art at 2x (whole numbers) */
    x.imageSmoothingEnabled = false;
    for (const s of SPRITES) { if (s.x + s.w < sx || s.x > sx + 280 || s.y + s.h < sy || s.y > sy + 315) continue;
      const sp = await loadImg(ART[s.k]).catch(() => null); if (!sp) continue;
      x.save(); const dx = (s.x - sx) * 2, dy = (s.y - sy) * 2;
      if (s.flip) { x.translate(dx + s.w * 2, dy); x.scale(-1, 1); x.drawImage(sp, 0, 0, s.w, s.h, 0, 0, s.w * 2, s.h * 2); }
      else x.drawImage(sp, 0, 0, s.w, s.h, dx, dy, s.w * 2, s.h * 2);

    x.imageSmoothingEnabled = true;
  }
  x.fillStyle = "#F2C230"; x.fillRect(560, 0, 6, H);
  x.fillStyle = "#f1e8d0"; x.fillRect(612, 52, 540, 526);
  x.fillStyle = "#b3241b"; x.font = '700 22px "Courier Prime", monospace'; x.fillText(`R.C.A.C. BALLARD · ${room.long.toUpperCase()}`, 640, 98, 490);
  x.fillStyle = "#1d2c4c"; let fs = 200; x.font = `900 ${fs}px "Big Shoulders Display", sans-serif`;
  while (x.measureText(o.value).width > 490 && fs > 70) { fs -= 10; x.font = `900 ${fs}px "Big Shoulders Display", sans-serif`; }
  x.fillText(o.value, 636, 120 + fs * 0.85);
  let y = 120 + fs * 0.85 + 54; x.fillStyle = "#3a2615"; x.font = '700 32px "Courier Prime", monospace';
  for (const l of wrap(x, o.label, 490).slice(0, 3)) { x.fillText(l, 640, y); y += 40; }
  x.fillStyle = "#3a3d4a"; x.font = '400 24px "Courier Prime", monospace'; x.fillText(o.sub || "", 640, y + 4, 490);
  x.fillStyle = "#23202E"; x.fillRect(612, 512, 540, 66); x.fillStyle = "#F2C230"; x.font = '700 26px "Courier Prime", monospace'; x.fillText("jimothythegame.com/stats", 636, 554);
  x.fillStyle = "#f4efe6"; x.textAlign = "right"; x.font = '400 20px "Courier Prime", monospace'; if (mode === "sample") x.fillText("SAMPLE DATA", 1128, 554); x.textAlign = "left";
  return cv;
}
let shareURL = null;

  drawCard(o).then(cv => shareCanvas(cv, `jimothy-${o.room}.png`, `${o.value} ${o.label}`, "Share this record", b, SITE + "#" + o.room));

window.__shareCard = o => drawCard(o).then(cv => cv.toDataURL("image/png")); /* review screenshots */
function openSheet(html, from) {
  const dlg = $("evDlg"); $("evSheet").innerHTML = html + `<p class="meta"><button class="btn" id="sheetClose">Close</button></p>`;
  dlg.setAttribute("aria-labelledby", $("evSheet").querySelector("h2").id || "sheetTitle");
  if (!dlg.open) dlg.showModal(); $("sheetClose").focus(); $("sheetClose").onclick = () => dlg.close();
  dlg.onclose = () => from && from.focus && from.focus();
}


/* ---------- navigation ---------- */
function setRange(r) {
  if (!RANGES.includes(r) || r === state.range) return;
  state.range = r; store.set("jimothy:office:range", r);
  history.replaceState(null, "", hashFor(state.room, r));
  load();
}
function renderAll() {
  renderStatus(); renderDirectory();
  const ov = state.room === "overview";
  $("v-overview").classList.toggle("on", ov); $("v-room").classList.toggle("on", !ov);
  if (ov) renderOverview(); else renderRoom();
  const f2 = $("forget2"); if (f2) f2.onclick = forgetYou;
  document.title = (ov ? "Sightings Office" : ROOM[state.room].long + " · Sightings Office") + " · Jimothy: Rain City Rumble";
}
let first = true;
function route() {
  const dlg = $("evDlg"); if (dlg && dlg.open) dlg.close(); /* a record or share sheet never outlives its room */
  const h = parseHash();
  if (h.you) readYou(h.you);
  const prev = state.room;
  state.room = h.room;
  if (h.range && h.range !== state.range) { state.range = h.range; store.set("jimothy:office:range", h.range); load(); }
  renderAll();
  if (!first && prev !== state.room) {
    const v = state.room === "overview" ? $("v-overview") : $("v-room");
    if (!reduce) { v.classList.remove("entering"); void v.offsetWidth; v.classList.add("entering");
      const L = v.querySelector(".scene .layer"); if (L && prev === "overview") { const to = L.style.transform; L.style.transform = L.dataset.from; void L.offsetWidth; L.classList.add("moving"); L.style.transform = to; } }
    window.scrollTo(0, 0);
    const t = state.room === "overview" ? $("main") : $("roomTitle"); if (t) t.focus({preventScroll: true});
  }
  first = false;
}
addEventListener("hashchange", route);
addEventListener("resize", () => { if (state.room === "overview") fitStage(); else renderRoom(); });
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea,select,dialog")) return;
  if (state.room === "office" && /^[1-4]$/.test(e.key) && !e.metaKey && !e.ctrlKey && !e.altKey) setRange(RANGES[+e.key - 1]);
});
setInterval(() => { if (mode === "live") renderStatus(); }, 60000);

/* ---------- start ---------- */
state.range = parseHash().range || (RANGES.includes(store.get("jimothy:office:range")) ? store.get("jimothy:office:range") : "30");
readYou(parseHash().you);
route();
load();
})();

</script>
