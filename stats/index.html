/* Rain City Animal Control, the Ballard field office's sightings records (docs/STATS_OFFICE.md; the design system is tools/stats_office/DESIGN.md).
   One kit, taken from the game: its night palette, its ink plates with a thin
   gold rim, its title-menu pixel capitals (drawn from ui/title_menu_skin.gd)
   and its UI face (Open Sans). Gold = yours / active / the way back to the game,
   amber-orange = rewards, red = alerts only, teal = links, green enamel = the department. */
:root{
  /* foundation and surfaces (the game's blue-hour street and its UI plates) */
  --night:#121428; --night-2:#171a33; --road:#191C33;
  --plate:#1B1825; --plate-deep:#12101B; --plate-hi:#23202E; --plate-line:rgba(242,194,48,.42); --hair:rgba(244,239,230,.12);
  /* text */
  --cream:#FFF0CC; --paper:#F4EFE6; --dim:#ADB3D1; --muted:#8A8FAD;
  /* accents with meaning */
  --gold:#F2C230; --gold-deep:#B8891A; --amber:#FFCC66; --orange:#F08A24; --teal:#4FB3A9; --danger:#E5484D;
  --enamel:#1D3A31; --enamel-hi:#2C5546; --enamel-lo:#11231D; --sodium:#E8A15A; --outline:#0F0E17;
  /* data: three series that stay apart (hue and lightness, plus dashes); rewards keep the orange-gold ramp */
  --c1:#E8A15A; --c2:#4FB3A9; --c3:#ADB3D1;
  /* type: the game's UI face for everything set in type; display lettering is drawn (pix()) */
  --f-ui:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;

  /* geometry and motion */
  --r-plate:6px; --r-ctl:4px; --r-chip:3px;
  --shadow:0 3px 8px rgba(0,0,6,.55);
  --t-press:120ms; --t-panel:240ms; --ease:cubic-bezier(.2,.7,.2,1);
  --wrap:1320px; --gut:24px;
  --mastH:64px; --dirH:64px; --px:7px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--mastH) + 16px);background:var(--night)}
body{margin:0;background:var(--night);color:var(--cream);font:400 16px/1.55 var(--f-ui);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
[tabindex="-1"]:focus{outline:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.skip{position:absolute;left:8px;top:-60px;z-index:50;background:var(--gold);color:var(--plate-deep);padding:10px 14px;font-weight:700;border-radius:var(--r-ctl)}
.skip:focus{top:8px}
.wrap{max-width:calc(var(--wrap) + 2 * var(--gut));margin:0 auto;padding:0 var(--gut)}
svg.pix{display:block;width:calc(var(--w) * var(--px));height:auto;shape-rendering:crispEdges;overflow:visible}
.ico{display:inline-block;flex:none;width:36px;height:36px;background:url(a/icons.0229c229c8.png) no-repeat;background-size:288px 36px}
.i-face{background-position:0 0}.i-file{background-position:-36px 0}.i-crew{background-position:-72px 0}.i-food{background-position:-108px 0}
.i-shiny{background-position:-144px 0}.i-ko{background-position:-180px 0}.i-phone{background-position:-216px 0}.i-curio{background-position:-252px 0}

/* ---------- controls (one family: primary gold, secondary plate, utility text) ---------- */
.btn-primary,.btn-plate{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 20px;border-radius:var(--r-ctl);
  font:800 15px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;position:relative;top:0;
  transition:top var(--t-press) var(--ease),box-shadow var(--t-press) var(--ease),background-color var(--t-press) var(--ease)}
.btn-primary{background:var(--gold);color:var(--plate-deep);box-shadow:inset 0 -3px 0 var(--gold-deep),0 2px 0 var(--outline)}
.btn-primary:hover{background:#FFD24A}
.btn-primary:active{top:2px;box-shadow:inset 0 -1px 0 var(--gold-deep),0 0 0 var(--outline)}
.btn-primary .dn{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.btn-plate{background:var(--plate);color:var(--cream);border:1px solid var(--plate-line);box-shadow:0 2px 0 var(--outline)}
.btn-plate:hover{background:var(--plate-hi);border-color:var(--gold)}
.btn-plate:active{top:2px;box-shadow:none}
@media (prefers-reduced-motion:reduce){.btn-primary,.btn-plate{transition:none}}

/* ---------- masthead: the office's front desk sign, every page ---------- */
.mast{position:sticky;top:0;z-index:30;height:var(--mastH);background:rgba(18,16,27,.94);border-bottom:1px solid var(--plate-line);box-shadow:0 4px 16px rgba(0,0,6,.45)}
.mast .wrap{height:100%;display:flex;align-items:center;gap:20px;max-width:none;padding:0 max(var(--gut),env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0;flex:0 1 auto}
.brand .bt{min-width:0}.brand b,.brand small{overflow:hidden;text-overflow:ellipsis}
.brand .seal{width:40px;height:40px;flex:none;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,6,.5)}
.brand b{display:block;font:800 15px/1.1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--cream);white-space:nowrap}
.brand small{display:block;font:600 12px/1.2 var(--f-ui);letter-spacing:.04em;color:var(--dim);white-space:nowrap;margin-top:3px}
.mast nav{margin-left:auto;min-width:0}
.dir ul{display:flex;gap:2px;list-style:none;margin:0;padding:0}
.dir a{display:flex;align-items:center;gap:7px;height:44px;padding:0 10px;font:700 13px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;color:var(--cream);border-radius:var(--r-ctl);white-space:nowrap;transition:color var(--t-press) var(--ease)}
.dir a:hover{color:var(--amber)}
.dir a[aria-current="page"]{color:var(--gold)}
.paw{width:14px;height:12px;flex:none;shape-rendering:crispEdges;fill:currentColor;opacity:0;margin-left:-4px}
.dir a[aria-current="page"] .paw{opacity:1}
.mast .btn-primary{min-height:40px;padding:0 16px;font-size:13px;flex:none}
@media (max-width:1399px){.dir a{padding:0 7px;letter-spacing:.04em;font-size:12px}.mast .wrap{gap:12px}.brand b{letter-spacing:.08em}}
.status{display:inline-flex;align-items:center;gap:8px;font:700 12px/1.2 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--dim)}
.status i{width:9px;height:9px;border-radius:50%;background:#6d6680;flex:none}
.status[data-s="live"] i{background:var(--danger);box-shadow:0 0 0 3px rgba(229,72,77,.22)}
.status[data-s="stale"] i{background:var(--orange)}
.status[data-s="sample"] i{background:var(--teal)}

/* compact directory (under 1100) */
.pdir{display:none}
@media (max-width:1099px){
  .mast nav{display:none}.mast .about{margin-left:auto}
  .pdir{display:block;position:sticky;top:var(--mastH);z-index:29;background:rgba(18,16,27,.96);border-bottom:1px solid var(--hair)}
  .pdir ul{display:flex;gap:4px;overflow-x:auto;list-style:none;margin:0;padding:6px 12px;scrollbar-width:none}
  .pdir ul::-webkit-scrollbar{display:none}
  .pdir a{flex:none;height:44px;padding:0 12px;border:1px solid transparent}
  .pdir a[aria-current="page"]{border-color:var(--plate-line);background:var(--plate)}
  html{scroll-padding-top:128px}
}
@media (max-width:599px){
  :root{--mastH:56px;--gut:16px;--px:5px}
  .mast .wrap{gap:10px}
  .brand .seal{width:32px;height:32px}
  .brand b{font-size:12px;letter-spacing:.05em}.mast .about{padding:0 12px;min-height:40px}.brand small{font-size:11px}.brand .bf{display:none}
  .mast .btn-primary{padding:0 12px;min-height:40px}
  .mast .btn-primary .lbl-long{display:none}
}
@media (max-width:359px){:root{--px:4px}.brand b{font-size:12px;letter-spacing:.04em}.mast .about{padding:0 10px}.seg-b{padding:0 8px;min-width:0;font-size:11px;letter-spacing:.03em}}
@media (min-width:600px){.mast .btn-primary .lbl-short{display:none}}

/* ---------- notices (failed, stale, sample, your game) ---------- */
.notice{max-width:calc(var(--wrap) + 2 * var(--gut));margin:0 auto;padding:10px var(--gut);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font:600 15px/1.4 var(--f-ui);
  background:#2c1c24;border-bottom:1px solid var(--danger)}
.notice[data-kind="stale"]{background:#2e2618;border-color:var(--orange)}
.notice[data-kind="sample"]{background:#16292a;border-color:var(--teal)}
.notice[data-kind="you"]{background:#2b2514;border-color:var(--gold)}
.notice p{margin:0;flex:1 1 320px}
.btn-text{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;background:none;border:0;cursor:pointer;
  font:700 13px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--teal);text-decoration:none;transition:color var(--t-press) var(--ease)}
.btn-text:hover{color:var(--amber)}
.btn-text:active{transform:translateY(1px)}
[aria-busy="true"].btn-plate,[aria-busy="true"].btn-text{opacity:.7;cursor:progress}
button:disabled,.btn-plate:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
/* the reporting period: one segmented control, the game's gold for the chosen one */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-ctl);background:var(--plate-deep);border:1px solid var(--hair)}
.seg-b{position:relative;min-height:38px;min-width:44px;padding:0 12px;border:0;border-radius:3px;background:transparent;cursor:pointer;
  font:700 12px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap;
  transition:background-color var(--t-press) var(--ease),color var(--t-press) var(--ease)}
.seg-b:hover{color:var(--cream);background:var(--plate-hi)}
.seg-b:active{transform:translateY(1px)}
.seg-b[aria-pressed="true"]{background:var(--gold);color:var(--plate-deep);box-shadow:inset 0 -2px 0 var(--gold-deep)}
.seg-b[aria-busy="true"]::after{content:"";position:absolute;left:30%;right:30%;bottom:4px;height:2px;border-radius:1px;background:currentColor;opacity:.6}
@media (prefers-reduced-motion:no-preference){.seg-b[aria-busy="true"]::after{animation:busy .8s ease-in-out infinite alternate}}
@keyframes busy{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
.seg.big{display:flex}.seg.big .seg-b{flex:1;min-height:44px}
@media (pointer:coarse){.seg-b{min-height:44px}}
@media (max-width:599px){.sec-meta .seg,.rh-tools .seg{display:flex;width:100%}.sec-meta .seg-b,.rh-tools .seg-b{flex:1 1 0;min-width:0;padding:0 4px}}

.view{display:none}.view.on{display:block}

/* ---------- shared heads ---------- */
.kicker{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin:0 0 6px;font:800 12px/1.3 var(--f-ui);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.kicker b{font-weight:800;color:var(--dim);letter-spacing:.12em}
.sec-sub{margin:6px 0 0;max-width:62ch;color:var(--dim);font-size:15px}
.tick{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:var(--r-chip);background:rgba(242,194,48,.14);border:1px solid rgba(242,194,48,.5);
  font:800 12px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
.sparkbox{position:relative;display:block;margin:16px 0 0}
.spark{display:block;width:100%;height:40px;overflow:visible}
.spark .ln{fill:none;stroke:var(--dim);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.spark .ar{fill:rgba(173,179,209,.10)}
.spark .bl{stroke:var(--hair);stroke-width:1;vector-effect:non-scaling-stroke}
.spark.bars rect{fill:var(--c1)}
.spark-cap{display:flex;justify-content:space-between;gap:8px;margin:6px 0 0;font:600 12px/1.3 var(--f-ui);color:var(--muted)}
.spark-cap b{color:var(--dim);font-variant-numeric:tabular-nums}
.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--plate)}
.skel{display:inline-block;min-width:2.2ch;color:transparent!important;background:linear-gradient(90deg,rgba(244,239,230,.07),rgba(244,239,230,.14),rgba(244,239,230,.07));border-radius:3px}
.sign-off svg.pix{--px:3px;opacity:.55}

/* ---------- one place: the app fills the screen below the masthead ---------- */
html,body{height:100%}
body{overflow:hidden}
#app{position:fixed;left:0;right:0;bottom:0;top:var(--mastH);overflow:hidden;background:#0c0e1f}
@media (max-width:1099px){#app{top:calc(var(--mastH) + 57px)}}
.vp{position:absolute;inset:0;overflow:hidden;touch-action:manipulation}
/* the letterbox: the same painting, dark and soft, so the edges of the frame are never flat bars */
.backdrop{position:absolute;inset:-40px;overflow:hidden;pointer-events:none}
.backdrop img{width:100%;height:100%;object-fit:cover;filter:blur(24px) brightness(.38) saturate(.9);transform:scale(1.08)}
.world{position:absolute;left:0;top:0;width:1440px;height:1080px;transform-origin:0 0;--s:1}
.world.moving{transition:transform .56s cubic-bezier(.65,0,.3,1)}
.world.moving .room .tag{opacity:0;transition:none}
@media (prefers-reduced-motion:reduce){.world.moving{transition:none}}
.world img.art{position:absolute;left:0;top:0;width:1440px;height:1080px;max-width:none;box-shadow:0 0 80px rgba(0,0,6,.6)}
.sprite{position:absolute;pointer-events:none;background-repeat:no-repeat;background-position:0 0;z-index:2}
.sprite.flip{transform:scaleX(-1)}
.sprite.hd{image-rendering:auto}
@media (prefers-reduced-motion:no-preference){.sprite.anim{animation:strip var(--t) steps(var(--n)) infinite}}
@keyframes strip{to{background-position:calc(var(--n) * var(--w) * -1) 0}}
.shadow{position:absolute;height:7px;border-radius:50%;background:radial-gradient(closest-side,rgba(8,6,16,.72),rgba(8,6,16,.42) 55%,rgba(8,6,16,0));pointer-events:none;z-index:1}
.beam{position:absolute;width:160px;height:90px;pointer-events:none;z-index:3;mix-blend-mode:screen;clip-path:polygon(100% 38%,0 0,0 100%,100% 52%);
  background:linear-gradient(to left,rgba(255,236,170,.55),rgba(255,236,170,.12) 70%,rgba(255,236,170,0))}
.world .roomhd{position:absolute;max-width:none;opacity:0;transition:opacity .3s;pointer-events:none}
.world .roomhd.on.ready{opacity:1}
@media (prefers-reduced-motion:reduce){.world .roomhd{transition:none}}
.world .sprite{image-rendering:auto}
.world.px .sprite:not(.hd){image-rendering:pixelated;image-rendering:crisp-edges}
.world .ov{position:absolute;pointer-events:none}
.signnum{display:flex;justify-content:center}.signnum svg.pix{--px:5px}
/* the LIVE lamp sits exactly on the dispatch radio's painted status light (art 365.5..370.5, 682..685.5): dark when not live */
.livelamp{width:5px;height:3.5px;border-radius:.6px;background:#3a1416}
.livelamp.on{background:#ff4d4d;box-shadow:0 0 2px .5px rgba(255,90,90,.85)}
/* rooms: real links; their tags stay a readable size at any camera scale */
.room{position:absolute;display:block;border-radius:2px;text-decoration:none;color:var(--cream);outline-offset:-3px;transition:box-shadow var(--t-press) var(--ease)}
.room:hover{box-shadow:inset 0 0 0 calc(2px / var(--s)) rgba(242,194,48,.85),inset 0 0 0 9999px rgba(242,194,48,.06)}
.room:focus-visible{outline:calc(3px / var(--s)) solid var(--gold)}
.room .tag{position:absolute;left:calc(6px / var(--s));top:calc(6px / var(--s));display:flex;align-items:center;gap:calc(6px / var(--s));
  font:800 calc(12px / var(--s))/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--cream);
  background:rgba(18,16,27,.92);border:calc(1px / var(--s)) solid var(--plate-line);border-radius:calc(3px / var(--s));padding:calc(7px / var(--s)) calc(9px / var(--s));white-space:nowrap;transition:opacity .3s}
.room .tag kbd{font:800 calc(10px / var(--s))/1 var(--f-ui);color:var(--plate-deep);background:var(--gold);border-radius:calc(2px / var(--s));padding:calc(2px / var(--s)) calc(4px / var(--s))}
.room:hover .tag,.room:focus-visible .tag{border-color:var(--gold);color:var(--gold);transform:translateY(calc(-2px / var(--s)))}
.room .tag{transition:transform var(--t-press) var(--ease),opacity .3s}
@media (prefers-reduced-motion:reduce){.room:hover .tag,.room:focus-visible .tag{transform:none}}
.world.zoomed .room.here{pointer-events:none}
.world.zoomed .room.here .tag{opacity:0}
.world.zoomed .room:not(.here) .tag{opacity:.75}
.room .tag.short .nm{display:none}
@media (max-width:899px){.world.zoomed .room:not(.here) .tag{opacity:0}}
.world .dim{position:absolute;z-index:5;background:rgba(10,9,20,.72);opacity:0;pointer-events:none;transition:opacity .4s}
.world.zoomed .dim{opacity:1;pointer-events:auto;cursor:zoom-out}
.world.zoomed .room:not(.here){z-index:6}
@media (prefers-reduced-motion:reduce){.world .dim,.room .tag{transition:none}}

/* ---------- the dispatch board over the yard (desktop) / the sheet (phones) ---------- */
.hud{position:absolute;z-index:10;right:24px;top:24px;width:340px;max-height:calc(100% - 48px);overflow:auto;padding:20px;border-radius:var(--r-plate);
  background:rgba(27,24,37,.96);border:1px solid var(--plate-line);box-shadow:var(--shadow);transition:opacity .3s,transform .3s}
body.zoomed .hud{opacity:0;transform:translateX(16px);pointer-events:none;visibility:hidden;transition:opacity .25s,transform .25s,visibility 0s .25s}
.hud-head{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:0 0 12px}
.hud-head .kicker{margin:0}
.hud-sign,.minisign{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px;border-radius:var(--r-plate);text-decoration:none;color:var(--cream);
  background:var(--enamel);border:2px solid var(--outline);box-shadow:inset 0 1px 0 var(--enamel-hi),inset 0 -3px 0 var(--enamel-lo)}
.hud-sign:hover{border-color:var(--gold)}
.ms-t{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.ms-l{font:800 11px/1.3 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--paper)}
.ms-n{font:600 13px/1.4 var(--f-ui);color:#CFE0D7}.ms-n b{color:var(--amber)}
.ms-w{display:flex;align-items:center;justify-content:center;min-width:80px;min-height:70px;padding:10px 12px;border-radius:4px;background:var(--plate-deep);box-shadow:inset 0 3px 0 rgba(0,0,0,.55)}
.ms-w svg.pix{--px:7px}.ms-w .sign-off svg.pix{--px:2px}
.hud-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 0}
.hud-stats div{display:flex;flex-direction:column;padding-top:10px;border-top:1px solid var(--hair);min-width:0}
.hud-stats dt{order:2;margin-top:4px;font:800 10.5px/1.3 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.hud-stats dd{order:1;margin:0;font:800 30px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--cream)}
.hud-stats dd.rw{color:var(--gold)}
.hud-note{margin:12px 0 0;font:600 13px/1.4 var(--f-ui);color:var(--dim)}
.hud .seg{display:flex;margin:16px 0 0}.hud .seg-b{flex:1 1 0;min-width:0;padding:0 4px}
.hud-rooms ul{list-style:none;margin:16px 0 0;padding:12px 0 0;border-top:1px solid var(--hair);display:grid;grid-template-columns:1fr 1fr;gap:4px}
.hud-rooms a{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 8px;border-radius:var(--r-ctl);text-decoration:none;color:var(--cream);font:700 13px/1.2 var(--f-ui)}
.hud-rooms a:hover{background:var(--plate-hi);color:var(--amber)}
.hud-rooms kbd{font:800 10px/1 var(--f-ui);color:var(--plate-deep);background:var(--gold);border-radius:2px;padding:2px 4px}
.hud-rooms small{margin-left:auto;font:600 11px/1 var(--f-ui);color:var(--muted)}
.selfnote{display:inline-flex;flex-wrap:wrap;align-items:center;gap:0 8px;font:600 13px/1.4 var(--f-ui);color:var(--amber)}
.selfnote .btn-text{min-height:32px;font-size:12px}
@media (pointer:coarse){.selfnote .btn-text,.hud-rooms a{min-height:44px}}

/* ---------- a room's records: docked beside it (desktop) or a sheet below it (phones) ---------- */
.side{position:absolute;z-index:12;right:0;top:0;bottom:0;width:var(--sideW,460px);display:flex;flex-direction:column;
  background:#12101B;border-left:1px solid var(--plate-line);box-shadow:-8px 0 24px rgba(0,0,6,.45)}
@media (max-width:1199px){.side{--sideW:420px}}
.side[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.side:not([hidden]){animation:sideIn .4s cubic-bezier(.2,.7,.2,1)}}
@keyframes sideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.side-head{padding:20px 24px 16px;border-bottom:1px solid var(--hair)}
.side-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.side-head h1{margin:4px 0 0;font:800 28px/1.15 var(--f-ui);color:var(--cream)}
.side-head .sec-sub{font-size:14px}
.side-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:14px 0 0}
.zoomout{min-height:40px;padding:0 12px;font-size:12px;gap:8px;white-space:nowrap;flex:none}.zoomout span[aria-hidden]{font-size:20px;line-height:1}
.side-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:16px 16px 24px}
.side .docs{display:flex;flex-direction:column;gap:12px;padding:0;max-width:none}
.side .docs>*{width:100%;align-self:stretch}
.side .panel{padding:20px}
.side-nav{display:flex;justify-content:space-between;gap:12px;margin:16px 0 0;padding:12px 4px 0;border-top:1px solid var(--hair)}
.sheet-grip{display:none}
/* phones: the board and the records are sheets under the building */
@media (max-width:899px){
  .hud{left:0;right:0;top:auto;bottom:0;width:auto;max-height:52%;border-radius:12px 12px 0 0;border-bottom:0;padding:16px 16px 12px}
  .hud-rooms ul{grid-template-columns:1fr 1fr}
  .side{left:0;right:0;top:auto;bottom:0;width:auto;height:50%;border-left:0;border-top:1px solid var(--plate-line);border-radius:12px 12px 0 0;box-shadow:0 -8px 24px rgba(0,0,6,.5);transition:height .35s cubic-bezier(.2,.7,.2,1)}
  .side.expanded{height:88%}
  @media (prefers-reduced-motion:no-preference){.side:not([hidden]){animation:sheetIn .4s cubic-bezier(.2,.7,.2,1)}}
  .sheet-grip{display:flex;justify-content:center;align-items:center;width:100%;min-height:28px;padding:0;background:none;border:0;cursor:pointer}
  .sheet-grip i{width:44px;height:5px;border-radius:3px;background:rgba(244,239,230,.35)}
  .side-head{padding:4px 16px 12px}.side-head h1{font-size:22px}.side-head .sec-sub{display:none}
  .side-tools{margin-top:10px}.side-tools .seg{display:flex;width:100%}.side-tools .seg-b{flex:1 1 0;min-width:0;padding:0 4px}
  .zoomout .lbl{display:none}.zoomout{min-width:44px;min-height:44px;padding:0}
  .side-body{padding:12px 12px 24px}
}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
/* about */
.defs{display:grid;grid-template-columns:1fr;gap:12px;margin:16px 0 0}
.defs dt{font:700 14px/1.3 var(--f-ui);color:var(--cream)}
.defs dd{margin:2px 0 0;font:400 14px/1.5 var(--f-ui);color:var(--dim)}
.about-logo{display:block;margin:16px 0 0;width:200px;height:auto}
.mast .about{margin-left:12px;flex:none}
.notices-wrap{position:absolute;z-index:20;left:16px;top:12px;width:min(560px,calc(100% - 32px))}
.notices-wrap .notice{border-radius:var(--r-plate);border:1px solid;box-shadow:var(--shadow)}

/* ---------- rooms: the same plates, labels and controls everywhere ---------- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* the records grid */
.docs{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;padding-top:24px;padding-bottom:16px}
.panel{grid-column:span 6;position:relative;display:flex;flex-direction:column;min-width:0;padding:24px;border-radius:var(--r-plate);background:var(--plate);border:1px solid var(--plate-line);box-shadow:var(--shadow);color:var(--cream)}
.panel.w4{grid-column:span 4}.panel.w8{grid-column:span 8}.panel.w12{grid-column:span 12}
@media (max-width:1023px){.panel,.panel.w4,.panel.w8{grid-column:span 12}}
@media (max-width:599px){.docs{gap:12px;padding-top:16px}.panel{padding:16px}}
.ph{margin:0 0 20px}
.tab{display:inline-flex;align-items:center;margin:0 0 10px;padding:4px 8px;border:1px solid var(--plate-line);border-bottom-color:transparent;border-radius:3px 3px 0 0;
  background:rgba(242,194,48,.08);font:800 11px/1.2 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.ph h2{margin:0;font:800 22px/1.25 var(--f-ui);color:var(--cream)}
.psub{margin:6px 0 0;font:400 15px/1.5 var(--f-ui);color:var(--dim);max-width:70ch}
.panel a{color:var(--teal);text-underline-offset:3px}
.panel a:hover{color:var(--amber)}
.panel a.btn-primary,.panel a.btn-primary:hover{color:var(--plate-deep)}
.btnrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:20px 0 0}
.btnrow.end{justify-content:flex-end}
.note-small{margin:16px 0 0;font:600 13px/1.5 var(--f-ui);color:var(--dim)}
.note-small b{color:var(--cream)}
/* stats: label, value, what it counts */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 24px;margin:0}
.stats.three,.stats.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:767px){.stats.three{grid-template-columns:1fr}}
.stat{display:flex;flex-direction:column;min-width:0;padding-top:12px;border-top:1px solid var(--hair)}
.stat dt{order:1;font:800 11px/1.3 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stat dd{order:2;margin:8px 0 0;font:800 36px/1 var(--f-ui);font-variant-numeric:tabular-nums lining-nums;color:var(--cream);overflow-wrap:anywhere}
.stat dd small{font:600 15px/1 var(--f-ui);color:var(--dim)}
.stat dd.sm{font-size:22px;line-height:1.2}
.stat small{order:3;margin-top:6px;font:600 13px/1.4 var(--f-ui);color:var(--muted)}
.stat.big dd{font-size:48px}
.stat.reward dd{color:var(--gold)}
.stat.you dd{color:var(--gold)}
@media (max-width:599px){.stats,.stats.c3{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stats.c3 .big{grid-column:1/-1}.stat dd{font-size:30px}.stat.big dd{font-size:38px}}
/* horizontal bars */
.hbars{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.hbars li{display:grid;grid-template-columns:minmax(120px,11em) minmax(0,1fr) auto;align-items:center;gap:6px 14px}
.hbars .hl{font:600 14px/1.3 var(--f-ui);color:var(--cream);min-width:0}
.hbars .tr{height:10px;border-radius:2px;background:var(--plate-deep);box-shadow:inset 0 1px 0 rgba(0,0,0,.5);overflow:hidden}
.hbars .tr i{display:block;height:100%;border-radius:2px;background:var(--c1)}
.hbars .hv{font:800 16px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--cream);text-align:right;min-width:3ch}
.hbars .hv small{font:600 12px/1 var(--f-ui);color:var(--muted)}
.hbars small{grid-column:2/-1;font:600 12px/1.4 var(--f-ui);color:var(--muted)}
.hbars li.rw .tr i{background:linear-gradient(90deg,var(--orange),var(--gold))}
.hbars li.you .tr{box-shadow:inset 0 0 0 1px var(--gold)}
.hbars.suspects li{grid-template-columns:48px minmax(100px,9em) minmax(0,1fr) auto}
.hbars.suspects small{grid-column:3/-1}
.mugs{width:48px;height:60px;background:url(a/suspects.e79f34fab3.webp) no-repeat;background-size:288px 60px;image-rendering:pixelated;border-radius:3px;background-color:var(--plate-deep)}
@media (max-width:599px){.bags{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.bag{padding:12px}.bag .how{font-size:12px}.bag .bt{position:static;align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs button{flex:none;padding:0 12px}
  .hbars li{grid-template-columns:minmax(0,1fr) auto}.hbars .tr{grid-column:1/-1;grid-row:2}.hbars small{grid-column:1/-1}
  .hbars.suspects li{grid-template-columns:48px minmax(0,1fr) auto}.hbars.suspects .tr{grid-column:2/-1}.hbars.suspects small{grid-column:2/-1}}
/* empty, offline, loading */
.note-empty{display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;margin:0 0 16px;padding:16px;border-radius:4px;background:var(--plate-deep);border:1px dashed rgba(244,239,230,.18)}
.note-empty p{margin:0;flex:1 1 240px;font:600 14px/1.5 var(--f-ui);color:var(--dim)}
.note-empty p b{color:var(--cream)}
.note-empty .ico{width:36px;height:36px;opacity:.75}
.note-empty.err{border-color:rgba(229,72,77,.45)}
.note-empty.wide{margin-bottom:16px}
.skel-block{display:block;margin:0 0 12px;border-radius:4px;background:linear-gradient(90deg,rgba(244,239,230,.05),rgba(244,239,230,.10),rgba(244,239,230,.05));background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.skel-block,.skel{animation:shimmer 1.4s linear infinite}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.skel{background-size:200% 100%!important}
/* in-world marks, used sparingly */
/* one stamp system: the same size, border, tilt and centred caps everywhere (report, crew, memo) */
.stamp{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-width:72px;margin:20px 0 0;padding:4px 10px 3px;border:2px solid currentColor;border-radius:3px;transform:rotate(-3deg);
  font:800 13px/1.2 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);opacity:.92;text-indent:.16em; /* the caps' trailing tracking, balanced so the word is centred */}
.stamp.hot,.stamp.caged{color:#F07C6C}
.stamp.free{color:var(--gold)}
.stamp.sealed{color:var(--muted)}
.yours{display:inline-block;font:800 11px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:var(--plate-deep);padding:4px 6px;border-radius:3px;vertical-align:middle}
.yourres{display:flex;flex-direction:column;gap:4px;margin:16px 0 0;padding:12px 14px;border-radius:4px;background:rgba(242,194,48,.10);border-left:3px solid var(--gold);font:600 15px/1.4 var(--f-ui);color:var(--cream)}
.yourres small{font-size:13px;color:var(--dim)}
.fieldnote{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:20px 0 0;font:italic 400 15px/1.5 var(--f-ui);color:var(--amber)}
.fieldnote .paw{width:12px;height:10px;opacity:1;margin:0;align-self:center;fill:var(--amber)}
.fieldnote small{font:700 11px/1 var(--f-ui);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wanted-art{display:flex;justify-content:center;padding:16px 0 4px;border-radius:4px;background:var(--plate-deep)}
.jimstill{display:block;background-repeat:no-repeat;background-position:0 0;image-rendering:pixelated;transform:scale(2);transform-origin:50% 100%;margin-top:94px}
.memo .stamp{margin-top:0}
/* charts */
.chart{min-width:0}
.ch-meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px}
.lg{display:inline-flex;align-items:center;gap:8px;font:700 13px/1.2 var(--f-ui);color:var(--cream)}
.lg i{display:inline-block;width:18px;height:3px;border-radius:2px;background:var(--c1)}
.lg.bar i{width:10px;height:12px;border-radius:1.5px}
.lg.dash i{background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 8px)}
.lg.c1 i{background-color:var(--c1)}.lg.c2 i{background-color:var(--c2)}.lg.c3 i{background-color:var(--c3)}
.lg.c3.dash i{background:repeating-linear-gradient(90deg,var(--c3) 0 5px,transparent 5px 8px)}
.ch-span{font:600 12px/1.3 var(--f-ui);color:var(--muted)}
.ch-plot{position:relative;border-radius:4px;background:var(--plate-deep);padding:8px 4px 0;cursor:crosshair;touch-action:pan-y}
.ch-plot:focus-visible{outline-offset:2px}
.ch-plot svg{display:block;width:100%;height:auto;overflow:visible}
.ch-plot text{font:600 11px var(--f-ui);fill:var(--muted)}
.ch-plot .grid{stroke:rgba(244,239,230,.07)}
.ch-plot .base{stroke:rgba(244,239,230,.22)}
.ch-plot polyline{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-plot polyline.dash{stroke-dasharray:6 5}
.ch-plot .c1{stroke:var(--c1)}.ch-plot rect.c1,.ch-plot circle.c1{fill:var(--c1);stroke:none}
.ch-plot .c2{stroke:var(--c2)}.ch-plot rect.c2,.ch-plot circle.c2{fill:var(--c2);stroke:none}
.ch-plot .c3{stroke:var(--c3)}.ch-plot rect.c3,.ch-plot circle.c3{fill:var(--c3);stroke:none}
.ch-plot rect{opacity:.88}
.ch-plot .guide{stroke:var(--gold);stroke-width:1;stroke-dasharray:3 3}
.ch-tip[hidden]{display:none}
.ch-tip{position:absolute;top:8px;z-index:3;display:flex;flex-direction:column;gap:4px;min-width:150px;padding:8px 12px;border-radius:4px;background:var(--plate-hi);border:1px solid var(--plate-line);box-shadow:var(--shadow);pointer-events:none;font:600 13px/1.3 var(--f-ui);color:var(--dim)}
.ch-tip>b{color:var(--cream);font-weight:800}
.ch-tip .lg{font-weight:600;color:var(--dim)}.ch-tip .lg b{color:var(--cream);margin-left:auto;padding-left:12px;font-variant-numeric:tabular-nums}
.ch-note{display:flex;align-items:center;gap:8px;margin:10px 0 0;font:600 12px/1.4 var(--f-ui);color:var(--dim)}
.ch-note .mk{width:8px;height:8px;border-radius:50%;border:2px solid var(--gold);flex:none}
details.nums{margin:12px 0 0;font:400 14px/1.4 var(--f-ui)}
details.nums summary{display:inline-flex;align-items:center;min-height:44px;cursor:pointer;font:700 12px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
details.nums summary:hover{color:var(--amber)}
details.nums table{border-collapse:collapse;width:100%;max-width:560px;font-variant-numeric:tabular-nums}
details.nums th,details.nums td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--hair);color:var(--cream)}
details.nums thead th{font:800 11px/1.2 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
details.nums tbody th{font-weight:600;color:var(--dim)}
/* buttons in records */
.sharebtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid var(--plate-line);border-radius:var(--r-ctl);background:transparent;cursor:pointer;
  font:700 12px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--cream);transition:border-color var(--t-press) var(--ease),background-color var(--t-press) var(--ease)}
.sharebtn svg{width:15px;height:15px;color:var(--teal)}
.sharebtn:hover{border-color:var(--gold);background:var(--plate-hi)}
.sharebtn:active{transform:translateY(1px)}
@media (pointer:coarse){.sharebtn{min-height:44px}}
.shimg{display:block;width:100%;height:auto;border-radius:4px;border:1px solid var(--hair);margin:0}
/* the sightings board */
.mapbox{position:relative;margin:0 0 16px;border-radius:4px;overflow:hidden;border:1px solid var(--hair);background:#0f2733;line-height:0}
.mapbox img{width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0;background:none;border:0;cursor:pointer}
.pin i{width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#8a8fad;border:2px solid var(--outline);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.pin.hot i{background:var(--c1)}.pin.locked i{background:#5c6078}
.pin.sel i{outline:3px solid var(--gold);outline-offset:2px}
.pin span{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12px/1 var(--f-ui);color:var(--cream);background:rgba(18,16,27,.94);border:1px solid var(--plate-line);border-radius:3px;padding:5px 7px;display:none}
.pin.sel span,.pin:hover span,.pin:focus-visible span{display:block}
.hoodlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.hoodlist button{width:100%;min-height:44px;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:0 12px;background:var(--plate-deep);border:1px solid var(--hair);border-radius:3px;cursor:pointer;font:600 14px/1.2 var(--f-ui);color:var(--cream)}
.hoodlist button:hover{border-color:var(--plate-line)}
.hoodlist button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.hoodlist .muted{color:var(--muted);font-size:13px}.hoodlist .n{color:var(--c1);font-weight:800}
.report{align-self:start}
.rep{margin:0;display:grid;gap:0}
.rep div{display:grid;grid-template-columns:7em 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--hair)}
.rep dt{font:800 11px/1.5 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.rep dd{margin:0;font:600 14px/1.4 var(--f-ui);color:var(--cream)}
.rep b{font:800 20px/1 var(--f-ui);font-variant-numeric:tabular-nums}
/* holding */
.lineup{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.mug{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px 14px;background:var(--plate-deep);border:1px solid var(--hair);border-radius:4px;cursor:pointer;color:var(--cream);
  transition:border-color var(--t-press) var(--ease),transform var(--t-panel) var(--ease)}
.mug:hover{border-color:var(--plate-line);transform:translateY(-2px)}
.mug:active{transform:none}
.mug.lead{border-color:var(--plate-line)}
.face{display:block;width:108px;height:108px;background-image:url(a/faces.60859a9d8e.webp);background-size:972px 216px;image-rendering:pixelated;background-color:#20263a;border-radius:3px}
.mug .nm{font:800 15px/1 var(--f-ui)}
.mug .stamp{margin:0;align-self:center}
.mug .yours{position:absolute;top:8px;right:8px}
.mug:not(.lead) .face{filter:saturate(.6) brightness(.8)}
.intake{display:flex;gap:16px;align-items:flex-start}
.intake .psub{margin:0}
/* the kitchen */
.rcpt{list-style:none;margin:0;padding:0;display:grid}
.rcpt li{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:2px 16px;padding:12px 0;border-top:1px solid var(--hair)}
.rcpt .rl{font:800 12px/1.3 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.rcpt b{font:800 28px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--cream)}
.rcpt em{grid-column:1/-1;font:italic 400 14px/1.4 var(--f-ui);color:var(--amber)}
.rcpt .sharebtn{min-height:40px;padding:0 10px}.rcpt .sharebtn span{display:none}
.rt{display:flex;justify-content:space-between;align-items:baseline;margin:0;padding:14px 0 0;border-top:2px solid var(--plate-line);font:800 13px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.rt b{font:800 34px/1 var(--f-ui);letter-spacing:0;color:var(--gold);font-variant-numeric:tabular-nums}
.souvs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.souvs a{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:44px;padding:12px;background:var(--plate-deep);border:1px solid var(--hair);border-radius:4px;text-decoration:none;color:var(--cream)}
.souvs a:hover{border-color:var(--plate-line)}
.souvs .sn{font:600 14px/1.35 var(--f-ui);color:var(--cream)}
.souvs small{font:700 11px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.tico{display:block;flex:none;width:60px;height:60px;background-image:url(a/trophies.c5e9b1f187.webp);background-repeat:no-repeat;image-rendering:pixelated}
/* evidence: the cabinet's drawers as filing tabs, the bags as tiles */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 20px;border-bottom:1px solid var(--plate-line)}
.tabs button{position:relative;top:1px;min-height:44px;padding:0 16px;border:1px solid transparent;border-bottom:0;border-radius:4px 4px 0 0;background:transparent;cursor:pointer;
  font:700 13px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.tabs button:hover{color:var(--cream)}
.tabs button[aria-selected="true"]{background:var(--plate);border-color:var(--plate-line);color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
.bags{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.bag{position:relative;display:flex;flex-direction:column;gap:6px;width:100%;height:100%;text-align:left;cursor:pointer;padding:16px;background:var(--plate-deep);border:1px solid var(--hair);border-radius:4px;color:var(--cream);
  transition:border-color var(--t-press) var(--ease),transform var(--t-panel) var(--ease)}
.bag:hover{border-color:var(--plate-line);transform:translateY(-2px)}
.bag:active{transform:none}
.bag.none .tico{filter:grayscale(1) opacity(.45)}
.bag .bt{position:absolute;top:14px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bag .nm{margin-top:4px;font:800 16px/1.2 var(--f-ui)}
.bag .how{font:400 13px/1.4 var(--f-ui);color:var(--dim)}
.bag .cnt{margin-top:auto;padding-top:6px;font:600 13px/1.3 var(--f-ui);color:var(--dim)}
.bag .cnt b{font:800 22px/1 var(--f-ui);color:var(--cream);font-variant-numeric:tabular-nums}
.bag .tr{display:block;height:6px;border-radius:2px;background:rgba(244,239,230,.06);overflow:hidden}
.bag .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold))}
.bag .rk{font:800 10px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--plate-deep);background:var(--amber);padding:4px 6px;border-radius:3px}
/* Mulch's office: Form AC-7 */
.optin{margin:20px 0 0;padding:16px;border-radius:4px;background:var(--plate-deep);border:1px solid var(--hair)}
.optin .tab{margin-bottom:8px}
.optin label{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;font:700 15px/1.3 var(--f-ui);color:var(--cream)}
.optin input{width:22px;height:22px;flex:none;accent-color:var(--gold)}
.optin input:disabled+span{opacity:.6}
.optin small{display:block;margin-top:2px;font:400 13px/1.4 var(--f-ui);color:var(--dim)}
/* sheets */
dialog{max-width:560px;width:calc(100% - 32px);border:0;padding:0;background:transparent;color:var(--cream)}
dialog::backdrop{background:rgba(10,8,18,.72)}
dialog .panel{grid-column:auto}
@media (prefers-reduced-motion:no-preference){dialog[open] .panel{animation:rise .2s ease-out}}

</style>

async function fetchLive(range, me) {
  const k = `${range}|${me ? 1 : 0}`;
  if (cache[k]) return cache[k];

  if (MY_ID) u += `&me=${MY_ID}` + (me ? "&include=1" : "");
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(u, {signal: ctl.signal, cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (!j || !j.live || !j.data || !Array.isArray(j.data.daily)) throw new Error("bad body");
    cache[k] = j; return j;
  } finally { clearTimeout(to); }
}

async function load() {
  if (REVIEW) {
    if (REVIEW === "loading") { mode = "loading"; body = null; return renderAll(); }
    if (REVIEW === "failed") { mode = "failed"; body = null; return renderAll(); }
    if (REVIEW === "sample") { mode = "sample"; body = sampleBody(state.range, false); return renderAll(); }
    mode = "live"; body = reviewBody(REVIEW); return renderAll();
  }
  if (mode === "sample") { body = sampleBody(state.range, state.me); return renderAll(); }
  const k = `${state.range}|${state.me ? 1 : 0}`;
  if (!cache[k]) { if (!body) mode = "loading"; renderStatus(); }
  try { body = await fetchLive(state.range, state.me); mode = "live"; }
  catch (e) { if (!body || !body.live) { mode = "failed"; body = null; } }

/* ---------- charts: one time-series component for every trend ----------
   Young data is shown honestly: the days before the first record in the period are cut,
   the axis starts on that day and says so, a lone day is a single labelled bar.
   Hover, tap or the arrow keys read each day; the numbers are also in a table. */
const CHARTS = {};
function tsChart(id, series, n, opts = {}) {
  const weekly = n > 120;
  const pack = v => { const s = (v || []).slice(-n); if (!weekly) return s; const out = []; for (let i = 0; i < s.length; i += 7) { const w = s.slice(i, i + 7); out.push(opts.sum ? w.reduce((a, b) => a + b, 0) : Math.round(w.reduce((a, b) => a + b, 0) / w.length * 10) / 10); } return out; };
  const S = series.map(x => Object.assign({}, x, {v: pack(x.values)}));
  const m0 = S[0].v.length;
  const dayOf = i => weekly ? Math.min(n - 1, i * 7) : i;
  let first = 0; while (first < m0 && S.every(x => !x.v[first])) first++;
  if (first >= m0) return emptyNote(opts.empty || "Nothing on file for this period.");
  const T = S.map(x => Object.assign({}, x, {v: x.v.slice(first)}));
  const m = m0 - first, labels = Array.from({length: m}, (_, i) => (weekly ? "week of " : "") + dayLabel(dayOf(i + first), n));
  CHARTS[id] = {labels, series: T.map(x => ({name: x.name, v: x.v, sw: x.cls + (x.dash ? " dash" : "") + (x.bars || m0 - first === 1 ? " bar" : "")}))};
  /* drawn at its panel's real width (the room's side panel or sheet) so labels stay 11 px; rooms re-render on resize */
  const host = $("sideBody"), vw = document.documentElement.clientWidth, inner = host && host.clientWidth ? host.clientWidth - 32 : Math.min(vw, 460) - 32;
  const W = Math.max(240, Math.round(inner - 40 - 6));
  const H = Math.round(Math.max(170, Math.min(250, W * 0.32))), L = 40, R = 14, Tp = 14, B = 28, pw = W - L - R, ph = H - Tp - B;
  const max = Math.max(1, ...T.flatMap(x => x.v));
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = Math.max(1, [1, 2, 5, 10].map(f => f * mag).find(v => v >= raw)); const top = step * 4;
  const slot = pw / m, X = i => L + slot * (i + 0.5), Y = v => Tp + ph * (1 - v / top);
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = top * k / 4, y = Y(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="${k ? "grid" : "base"}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${fmtN(Math.round(v))}</text>`; }
  const every = Math.max(1, Math.ceil(m / 6));
  for (let i = 0; i < m; i += every) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(dayLabel(dayOf(i + first), n))}</text>`;
  if ((m - 1) % every && m > 1) g += `<text x="${X(m - 1)}" y="${H - 8}" text-anchor="end" dx="${slot / 2}">${esc(dayLabel(dayOf(m - 1 + first), n))}</text>`;
  const bw = Math.min(28, Math.max(2, slot * 0.62));
  const marks = T.map(x => (x.bars || m === 1)
    ? x.v.map((v, i) => `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, Y(0) - Y(v)).toFixed(1)}" rx="1.5" class="${x.cls}"/>`).join("")
    : `<polyline points="${x.v.map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ")}" class="${x.cls}${x.dash ? " dash" : ""}"/>` + (m <= 12 ? x.v.map((v, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" class="pt ${x.cls}"/>`).join("") : "")).join("");
  const legend = T.map(x => `<span class="lg ${x.cls}${x.dash ? " dash" : ""}${x.bars || m === 1 ? " bar" : ""}"><i aria-hidden="true"></i>${esc(x.name)}</span>`).join("");
  const rows = labels.map((lb, i) => `<tr><th scope="row">${esc(lb)}</th>${T.map(x => `<td>${fmtN(x.v[i])}</td>`).join("")}</tr>`).join("");
  const span = m === 1 ? `${labels[0]} only` : `${labels[0]} to ${labels[m - 1]}`;
  const young = first > 0 ? `<p class="ch-note"><span class="mk" aria-hidden="true"></span>First records in this period: ${esc(dayLabel(dayOf(first), n))}. Earlier days had none and are left off.</p>` : "";
  return `<div class="chart" data-chart="${id}">
    <div class="ch-meta"><div class="legend">${legend}</div><span class="ch-span">${esc(span)}${weekly ? " &middot; by week" : ""}</span></div>
    <div class="ch-plot" tabindex="0" role="group" aria-label="${esc((opts.label || "") + ", " + span)}. Use the arrow keys to read each ${weekly ? "week" : "day"}.">
      <svg viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${g}${marks}<line class="guide" x1="0" x2="0" y1="${Tp}" y2="${Tp + ph}" visibility="hidden"/></svg>
      <div class="ch-tip" hidden></div><span class="vh" aria-live="polite"></span></div>
    ${young}${m === 1 ? `<p class="ch-note">One day on file so far; the trend appears as records come in.</p>` : ""}
    <details class="nums"><summary>Show the numbers</summary><table><thead><tr><th scope="col">${weekly ? "Week" : "Day"}</th>${T.map(x => `<th scope="col">${esc(x.name)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></details></div>`;
}
function wireCharts() {
  for (const el of document.querySelectorAll("[data-chart]")) {
    const c = CHARTS[el.dataset.chart]; if (!c) continue;
    const plot = el.querySelector(".ch-plot"), svg = plot.querySelector("svg"), tip = plot.querySelector(".ch-tip"), live = plot.querySelector(".vh"), guide = svg.querySelector(".guide");
    const m = c.labels.length; let at = -1;
    const show = i => {
      at = Math.max(0, Math.min(m - 1, i));
      const vb = svg.viewBox.baseVal, slot = (vb.width - 40 - 14) / m, x = 40 + slot * (at + 0.5);
      guide.setAttribute("x1", x); guide.setAttribute("x2", x); guide.setAttribute("visibility", "visible");
      tip.innerHTML = `<b>${esc(c.labels[at])}</b>` + c.series.map(s => `<span class="lg ${s.sw}"><i aria-hidden="true"></i>${esc(s.name)} <b>${fmtN(s.v[at])}</b></span>`).join("");
      tip.hidden = false;
      const px = x / vb.width * plot.clientWidth, tw = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(plot.clientWidth - tw, px - tw / 2)) + "px";
      live.textContent = `${c.labels[at]}: ` + c.series.map(s => `${s.name} ${fmtN(s.v[at])}`).join(", ");
    };
    const hide = () => { tip.hidden = true; guide.setAttribute("visibility", "hidden"); };
    const fromX = e => { const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; const x = (e.clientX - r.left) / r.width * vb.width; return Math.floor((x - 40) / ((vb.width - 54) / m)); };
    plot.onpointermove = e => show(fromX(e));
    plot.onpointerdown = e => show(fromX(e));
    plot.onpointerleave = e => { if (e.pointerType === "mouse") hide(); };
    plot.onkeydown = e => { const k = {ArrowRight: 1, ArrowLeft: -1}[e.key]; if (k) { e.preventDefault(); show(at < 0 ? (k > 0 ? 0 : m - 1) : at + k); } if (e.key === "Home") { e.preventDefault(); show(0); } if (e.key === "End") { e.preventDefault(); show(m - 1); } if (e.key === "Escape") hide(); };
    plot.onblur = hide;
  }
}
/* Horizontal bars: label, track, value; every row says what it counts. */
function hbars(rows, opts = {}) {

addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("input,textarea,select,dialog,.ch-plot,[role=tab]")) return;
  if (e.key === "Escape" && state.room !== "overview") { e.preventDefault(); go("overview"); return; }
  if (/^[1-6]$/.test(e.key)) { go(ROOMS[+e.key - 1].id); return; }
  const dir = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[e.key];
  if (dir && state.room !== "overview" && !(e.target.closest && e.target.closest(".side-body"))) {
    const n = neighbour(state.room, dir[0], dir[1]); if (n) { e.preventDefault(); go(n); }
  }
});
document.addEventListener("click", e => {
  if (e.target.closest && e.target.closest("[data-out]")) { go("overview"); return; }
  if (e.target.closest && e.target.closest("[data-about]")) { openAbout(e.target.closest("[data-about]")); }
});
/* a tap on the dimmed building outside the room returns to the whole building */
document.addEventListener("click", e => { if (state.room !== "overview" && e.target.closest && e.target.closest(".dim")) go("overview"); });
function openAbout(from) {
  openSheet(`<header class="ph"><p class="tab">Records office</p><h2 id="sheetTitle">About these records</h2></header>
    <p class="psub">Anonymous play stats from <b>Jimothy: Rain City Rumble</b>, a rainy-Seattle pixel-art platformer about a round raccoon on very long legs. Rain City Animal Control is part of the game; no real animal is tracked here.</p>
    <dl class="defs">
      <div><dt>Players</dt><dd>Game installs that share anonymous play stats. One install is one player, so someone on two devices counts twice.</dd></div>
      <div><dt>Runs</dt><dd>Each time a level starts. One player can file many runs.</dd></div>
      <div><dt>Escapes</dt><dd>Runs that free Nugget from his cage by the Ballard Locks.</dd></div>
      <div><dt>Updates</dt><dd>The file refreshes every few minutes. It says Live only while the numbers are fresh.</dd></div>
      <div><dt>Your own runs</dt><dd>A browser that plays the game is left out of the counts unless you include it, so totals are everyone else's.</dd></div>
    </dl>
    <p class="note-small"><a href="privacy.html">Privacy</a> &middot; Numbers count players and runs, never people. Keys: 1 to 6 open a room, the arrow keys move between rooms, Escape returns to the whole building.</p>
    <img class="about-logo" src="${ART.logo}" width="260" height="123" alt="Jimothy: Rain City Rumble" loading="lazy">`, from);
}
setInterval(() => { if (mode === "live") renderStatus(); }, 60000);

/* ---------- start ---------- */
state.range = parseHash().range || (RANGES.includes(store.get("jimothy:office:range")) ? store.get("jimothy:office:range") : "30");
readYou(parseHash().you);
buildWorld();
route();
load();
})();

</script>
</body>
</html>
