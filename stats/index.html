/* Rain City Animal Control, the Ballard field office's sightings records (docs/STATS_OFFICE.md; the design system is tools/stats_office/DESIGN.md).
   One kit, taken from the game: its night palette, its ink plates with a thin
   gold rim, its title-menu pixel capitals (drawn from ui/title_menu_skin.gd)
   and its UI face (Open Sans). Gold = yours / active / the way back to the game,
   amber-orange = rewards, red = alerts only, teal = links, green enamel = the department. */
:root{
  /* foundation and surfaces (the game's blue-hour street and its UI plates) */
  --night:#121428; --night-2:#171a33; --road:#191C33;
  --plate:#1B1825; --plate-deep:#12101B; --plate-hi:#23202E; --plate-line:rgba(242,194,48,.42); --hair:rgba(244,239,230,.12);
  /* text */
  --cream:#FFF0CC; --paper:#F4EFE6; --dim:#ADB3D1; --muted:#8A8FAD;
  /* accents with meaning */
  --gold:#F2C230; --gold-deep:#B8891A; --amber:#FFCC66; --orange:#F08A24; --teal:#4FB3A9; --danger:#E5484D;
  --enamel:#1D3A31; --enamel-hi:#2C5546; --enamel-lo:#11231D; --sodium:#E8A15A; --outline:#0F0E17;
  /* data: three series that stay apart (hue and lightness, plus dashes); rewards keep the orange-gold ramp */
  --c1:#E8A15A; --c2:#4FB3A9; --c3:#ADB3D1;
  /* type: the game's UI face for everything set in type; display lettering is drawn (pix()) */
  --f-ui:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;

  /* geometry and motion */
  --r-plate:6px; --r-ctl:4px; --r-chip:3px;
  --shadow:0 3px 8px rgba(0,0,6,.55);
  --t-press:120ms; --t-panel:240ms; --ease:cubic-bezier(.2,.7,.2,1);
  --wrap:1320px; --gut:24px;
  --mastH:64px; --dirH:64px; --px:7px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--mastH) + 16px);background:var(--night)}
body{margin:0;background:var(--night);color:var(--cream);font:400 16px/1.55 var(--f-ui);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
[tabindex="-1"]:focus{outline:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.skip{position:absolute;left:8px;top:-60px;z-index:50;background:var(--gold);color:var(--plate-deep);padding:10px 14px;font-weight:700;border-radius:var(--r-ctl)}
.skip:focus{top:8px}
.wrap{max-width:calc(var(--wrap) + 2 * var(--gut));margin:0 auto;padding:0 var(--gut)}
svg.pix{display:block;width:calc(var(--w) * var(--px));height:auto;shape-rendering:crispEdges;overflow:visible}
.ico{display:inline-block;flex:none;width:36px;height:36px;background:url(a/icons.0229c229c8.png) no-repeat;background-size:288px 36px}
.i-face{background-position:0 0}.i-file{background-position:-36px 0}.i-crew{background-position:-72px 0}.i-food{background-position:-108px 0}
.i-shiny{background-position:-144px 0}.i-ko{background-position:-180px 0}.i-phone{background-position:-216px 0}.i-curio{background-position:-252px 0}

/* ---------- controls (one family: primary gold, secondary plate, utility text) ---------- */
.btn-primary,.btn-plate{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 20px;border-radius:var(--r-ctl);
  font:800 15px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;position:relative;top:0;
  transition:top var(--t-press) var(--ease),box-shadow var(--t-press) var(--ease),background-color var(--t-press) var(--ease)}
.btn-primary{background:var(--gold);color:var(--plate-deep);box-shadow:inset 0 -3px 0 var(--gold-deep),0 2px 0 var(--outline)}
.btn-primary:hover{background:#FFD24A}
.btn-primary:active{top:2px;box-shadow:inset 0 -1px 0 var(--gold-deep),0 0 0 var(--outline)}
.btn-primary .dn{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.btn-plate{background:var(--plate);color:var(--cream);border:1px solid var(--plate-line);box-shadow:0 2px 0 var(--outline)}
.btn-plate:hover{background:var(--plate-hi);border-color:var(--gold)}
.btn-plate:active{top:2px;box-shadow:none}
@media (prefers-reduced-motion:reduce){.btn-primary,.btn-plate{transition:none}}

/* ---------- masthead: the office's front desk sign, every page ---------- */
.mast{position:sticky;top:0;z-index:30;height:var(--mastH);background:rgba(18,16,27,.94);border-bottom:1px solid var(--plate-line);box-shadow:0 4px 16px rgba(0,0,6,.45)}
.mast .wrap{height:100%;display:flex;align-items:center;gap:20px;max-width:none;padding:0 max(var(--gut),env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0;flex:0 1 auto}
.brand .bt{min-width:0}.brand b,.brand small{overflow:hidden;text-overflow:ellipsis}
.brand .seal{width:40px;height:40px;flex:none;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,6,.5)}
.brand b{display:block;font:800 18px/1.1 var(--f-ui);letter-spacing:.01em;color:var(--cream);white-space:nowrap}
.brand small{display:block;font:600 13px/1.2 var(--f-ui);letter-spacing:.02em;color:var(--dim);white-space:nowrap;margin-top:3px}
.mast nav{margin-left:auto;min-width:0}
.dir ul{display:flex;gap:2px;list-style:none;margin:0;padding:0}
.dir a{display:flex;align-items:center;gap:7px;height:44px;padding:0 10px;font:700 13px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;color:var(--cream);border-radius:var(--r-ctl);white-space:nowrap;transition:color var(--t-press) var(--ease)}
.dir a:hover{color:var(--amber)}
.dir a[aria-current="page"]{color:var(--gold)}
.paw{width:14px;height:12px;flex:none;shape-rendering:crispEdges;fill:currentColor;opacity:0;margin-left:-4px}
.dir a[aria-current="page"] .paw{opacity:1}
.mast .btn-primary{min-height:40px;padding:0 16px;font-size:13px;flex:none}
@media (max-width:1399px){.dir a{padding:0 7px;letter-spacing:.04em;font-size:12px}.mast .wrap{gap:12px}.brand b{font-size:15px}.brand small{font-size:12px}}
@media (max-width:1199px){.dir a{padding:0 5px;letter-spacing:.02em}.dir a .paw{display:none}.brand .seal{width:34px;height:34px}}
.status{display:inline-flex;align-items:center;gap:8px;font:700 12px/1.2 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--dim)}
.status i{width:9px;height:9px;border-radius:50%;background:#6d6680;flex:none}
.status[data-s="live"] i{background:var(--danger);box-shadow:0 0 0 3px rgba(229,72,77,.22)}
.status[data-s="stale"] i{background:var(--orange)}
.status[data-s="sample"] i{background:var(--teal)}

/* compact directory (under 1100) */
.pdir{display:none}
@media (max-width:1099px){
  .mast nav{display:none}.mast .about{margin-left:auto}
  .pdir{display:block;position:sticky;top:var(--mastH);z-index:29;background:rgba(18,16,27,.96);border-bottom:1px solid var(--hair)}
  .pdir ul{display:flex;gap:4px;overflow-x:auto;list-style:none;margin:0;padding:6px 12px;scrollbar-width:none}
  .pdir ul::-webkit-scrollbar{display:none}
  .pdir a{flex:none;height:44px;padding:0 12px;border:1px solid transparent}
  .pdir a[aria-current="page"]{border-color:var(--plate-line);background:var(--plate)}
  html{scroll-padding-top:128px}
}
@media (max-width:599px){
  :root{--mastH:56px;--gut:16px;--px:5px}
  .mast .wrap{gap:10px}
  .brand .seal{width:32px;height:32px}
  .brand b{font-size:15px}.mast .about{padding:0 12px;min-height:40px}.brand small{font-size:12px}
  .mast .btn-primary{padding:0 12px;min-height:40px}
  .mast .btn-primary .lbl-long{display:none}
}
@media (max-width:359px){:root{--px:4px}.brand b{font-size:14px}.mast .about{padding:0 10px}.seg-b{padding:0 8px;min-width:0;font-size:11px;letter-spacing:.03em}}
@media (min-width:600px){.mast .btn-primary .lbl-short{display:none}}

/* ---------- notices (failed, stale, sample, your game) ---------- */
.notice{max-width:calc(var(--wrap) + 2 * var(--gut));margin:0 auto;padding:10px var(--gut);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font:600 15px/1.4 var(--f-ui);
  background:#2c1c24;border-bottom:1px solid var(--danger)}
.notice[data-kind="stale"]{background:#2e2618;border-color:var(--orange)}
.notice[data-kind="sample"]{background:#16292a;border-color:var(--teal)}
.notice[data-kind="you"]{background:#2b2514;border-color:var(--gold)}
.notice p{margin:0;flex:1 1 320px}
.btn-text{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;background:none;border:0;cursor:pointer;
  font:700 13px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--teal);text-decoration:none;transition:color var(--t-press) var(--ease)}
.btn-text:hover{color:var(--amber)}
.btn-text:active{transform:translateY(1px)}
[aria-busy="true"].btn-plate,[aria-busy="true"].btn-text{opacity:.7;cursor:progress}
button:disabled,.btn-plate:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
/* the reporting period: one segmented control, the game's gold for the chosen one */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-ctl);background:var(--plate-deep);border:1px solid var(--hair)}
.seg-b{position:relative;min-height:38px;min-width:44px;padding:0 12px;border:0;border-radius:3px;background:transparent;cursor:pointer;
  font:700 12px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap;
  transition:background-color var(--t-press) var(--ease),color var(--t-press) var(--ease)}
.seg-b:hover{color:var(--cream);background:var(--plate-hi)}
.seg-b:active{transform:translateY(1px)}
.seg-b[aria-pressed="true"]{background:var(--gold);color:var(--plate-deep);box-shadow:inset 0 -2px 0 var(--gold-deep)}
.seg-b[aria-busy="true"]::after{content:"";position:absolute;left:30%;right:30%;bottom:4px;height:2px;border-radius:1px;background:currentColor;opacity:.6}
@media (prefers-reduced-motion:no-preference){.seg-b[aria-busy="true"]::after{animation:busy .8s ease-in-out infinite alternate}}
@keyframes busy{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
.seg.big{display:flex}.seg.big .seg-b{flex:1;min-height:44px}
@media (pointer:coarse){.seg-b{min-height:44px}}
@media (max-width:599px){.sec-meta .seg,.rh-tools .seg{display:flex;width:100%}.sec-meta .seg-b,.rh-tools .seg-b{flex:1 1 0;min-width:0;padding:0 4px}}

.view{display:none}.view.on{display:block}

/* ---------- shared heads ---------- */
.kicker{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin:0 0 6px;font:800 12px/1.3 var(--f-ui);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.kicker b{font-weight:800;color:var(--dim);letter-spacing:.12em}
.sec-sub{margin:6px 0 0;max-width:62ch;color:var(--dim);font-size:15px}
.tick{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:var(--r-chip);background:rgba(242,194,48,.14);border:1px solid rgba(242,194,48,.5);
  font:800 12px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
.sparkbox{position:relative;display:block;margin:16px 0 0}
.spark{display:block;width:100%;height:40px;overflow:visible}
.spark .ln{fill:none;stroke:var(--dim);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.spark .ar{fill:rgba(173,179,209,.10)}
.spark .bl{stroke:var(--hair);stroke-width:1;vector-effect:non-scaling-stroke}
.spark.bars rect{fill:var(--c1)}.spark.bars rect.today{opacity:.45}
.spark-cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;margin:6px 0 0;font:600 12px/1.3 var(--f-ui);color:var(--muted)}
.spark-cap b{color:var(--dim);font-variant-numeric:tabular-nums}
.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--plate)}
.skel{display:inline-block;min-width:2.2ch;color:transparent!important;background:linear-gradient(90deg,rgba(244,239,230,.07),rgba(244,239,230,.14),rgba(244,239,230,.07));border-radius:3px}
.sign-off svg.pix{--px:3px;opacity:.55}

/* ---------- one place: the app fills the screen below the masthead ---------- */
html,body{height:100%}
body{overflow:hidden}
#app{position:fixed;left:0;right:0;bottom:0;top:var(--mastH);overflow:hidden;background:#0c0e1f}
@media (max-width:1099px){#app{top:calc(var(--mastH) + 57px)}}
.vp{position:absolute;inset:0;overflow:hidden;touch-action:manipulation}
.vp:has(.world.zoomed){touch-action:pan-y;cursor:grab} /* a close-up wider than the view pans sideways with a drag or swipe */
/* the letterbox: the same painting, dark and soft, so the edges of the frame are never flat bars */
.backdrop{position:absolute;inset:-40px;overflow:hidden;pointer-events:none}
.backdrop img{width:100%;height:100%;object-fit:cover;filter:blur(24px) brightness(.38) saturate(.9);transform:scale(1.08)}
.world{position:absolute;left:0;top:0;width:1440px;height:1080px;transform-origin:0 0;--s:1}
.rainc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* the painting's outer edge feathered into the blurred night behind it (no hard box where the picture ends) */
.world img.art{-webkit-mask-image:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent),linear-gradient(transparent,#000 22px,#000 calc(100% - 22px),transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent),linear-gradient(transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-composite:intersect}
.world.moving{transition:transform .56s cubic-bezier(.65,0,.3,1)}
.world.loading{opacity:0}
.world{transition:opacity .35s ease-out}
@media (prefers-reduced-motion:reduce){.world{transition:none}}
.world.moving .room .tag{opacity:0;transition:none}
@media (prefers-reduced-motion:reduce){.world.moving{transition:none}}
.world img.art{position:absolute;left:0;top:0;width:1440px;height:1080px;max-width:none;box-shadow:0 0 80px rgba(0,0,6,.6)}
.sprite{position:absolute;pointer-events:none;background-repeat:no-repeat;background-position:0 0;z-index:2}
.sprite.flip{transform:scaleX(-1)}
.sprite.hd{image-rendering:auto}
@media (prefers-reduced-motion:no-preference){.sprite.anim{animation:strip var(--t) steps(var(--n)) infinite}
  .sprite.seq{animation:var(--seq) var(--t) linear infinite}
  .sprite.anim.rows{animation:stripx var(--tx) steps(var(--n)) infinite,stripy var(--t) steps(var(--r)) infinite}}
@keyframes strip{to{background-position:calc(var(--n) * var(--w) * -1) 0}}
@keyframes stripx{to{background-position-x:calc(var(--n) * var(--w) * -1)}}
@keyframes stripy{to{background-position-y:calc(var(--r) * var(--h) * -1)}}
.shadow{position:absolute;height:7px;border-radius:50%;background:radial-gradient(closest-side,rgba(8,6,16,.72),rgba(8,6,16,.42) 55%,rgba(8,6,16,0));pointer-events:none;z-index:1}
/* Dale's flashlight (kit.py beam): the beam in the damp air and the warm light it lays on what it reaches, both screened
   (a colour dodge drew a flat red wedge in WebKit); swept together from the lens */
.beam{position:absolute;pointer-events:none;z-index:3;mix-blend-mode:screen;background-size:100% 100%;background-repeat:no-repeat}
.world .beam{transition:opacity .18s ease-out}
.world .roomhd{position:absolute;max-width:none;opacity:0;transition:opacity .3s;pointer-events:none}
.world .roomhd.on.ready{opacity:1}
@media (prefers-reduced-motion:reduce){.world .roomhd{transition:none}}
.world .sprite{image-rendering:auto}
.world.px .sprite:not(.hd){image-rendering:pixelated;image-rendering:crisp-edges}
.world.crisp6 .sprite,.world.crisp6 .roomhd,.world.crisp6 .egg.rat,.world.crisp6 .egg.hatch,.world.crisp6 .amb.gull{image-rendering:pixelated;image-rendering:crisp-edges}
.world .ov{position:absolute;pointer-events:none}
/* the chalk number: Cabin Sketch (OFL), chalk white, a rough edge and grain from the #chalk filter; on a change it is
   wiped and rewritten (off under reduced motion) */
.chalknum{display:flex;align-items:center;justify-content:center;font-family:"Cabin Sketch",var(--f-ui);font-weight:700;line-height:1;
  color:rgba(240,238,228,.92);text-shadow:0 0 1px rgba(255,255,255,.35);filter:url(#chalk);letter-spacing:.02em}
.chalknum span{display:block;transform:rotate(-2deg) translateY(1px)}
@media (prefers-reduced-motion:no-preference){.chalknum.rewrite span{animation:chalkWrite .9s steps(9) both}}
@keyframes chalkWrite{0%{clip-path:inset(0 100% 0 0);opacity:.2}100%{clip-path:inset(0 0 0 0);opacity:1}}
/* the LIVE lamp sits exactly on the dispatch radio's painted status light (art 365.5..370.5, 682..685.5): dark when not live */
.livelamp{width:2.9px;height:3.3px;border-radius:.6px;background:#3a1416}
.livelamp.on{background:#ff4d4d;box-shadow:0 0 2px .5px rgba(255,90,90,.85)}
/* rooms: real links; their tags stay a readable size at any camera scale */
.room{position:absolute;display:block;border-radius:2px;text-decoration:none;color:var(--cream);outline-offset:-3px;transition:box-shadow var(--t-press) var(--ease)}
.room:hover{box-shadow:inset 0 0 0 calc(2px / var(--s)) rgba(242,194,48,.85),inset 0 0 0 9999px rgba(242,194,48,.06)}
.room:focus-visible{outline:calc(3px / var(--s)) solid var(--gold)}
.room .tag{position:absolute;left:calc(6px / var(--s));top:calc(6px / var(--s));display:flex;align-items:center;gap:calc(6px / var(--s));
  font:800 calc(12px / var(--s))/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--cream);
  background:rgba(18,16,27,.92);border:calc(1px / var(--s)) solid var(--plate-line);border-radius:calc(3px / var(--s));padding:calc(7px / var(--s)) calc(9px / var(--s));white-space:nowrap;transition:opacity .3s}
.room .tag kbd{font:800 calc(10px / var(--s))/1 var(--f-ui);color:var(--plate-deep);background:var(--gold);border-radius:calc(2px / var(--s));padding:calc(2px / var(--s)) calc(4px / var(--s))}
.room:hover .tag,.room:focus-visible .tag{border-color:var(--gold);color:var(--gold);transform:translateY(calc(-2px / var(--s)))}
.room .tag{transition:transform var(--t-press) var(--ease),opacity .3s}
@media (prefers-reduced-motion:reduce){.room:hover .tag,.room:focus-visible .tag{transform:none}}
.world.zoomed .room.here{pointer-events:none}
.world.zoomed .room.here .tag{opacity:0}
.world.zoomed .room:not(.here) .tag{opacity:.75}
.room .tag.short .nm{display:none}
.world .room .tag.under{visibility:hidden}
@media (max-width:899px){.world.zoomed .room:not(.here) .tag{opacity:0}}
.world .dim{position:absolute;z-index:5;background:rgba(10,9,20,.72);opacity:0;pointer-events:none;transition:opacity .4s}
.world.zoomed .dim{opacity:1;pointer-events:auto;cursor:zoom-out}
.world.zoomed .room:not(.here){z-index:6}
@media (prefers-reduced-motion:reduce){.world .dim,.room .tag{transition:none}}

/* ---------- the dispatch board over the yard (desktop) / the sheet (phones) ---------- */
.hud{position:absolute;z-index:10;right:24px;top:24px;width:340px;max-height:calc(100% - 48px);overflow:auto;padding:20px;border-radius:var(--r-plate);
  background:rgba(27,24,37,.96);border:1px solid var(--plate-line);box-shadow:var(--shadow);transition:opacity .3s,transform .3s}
body.zoomed .hud{opacity:0;transform:translateX(16px);pointer-events:none;visibility:hidden;transition:opacity .25s,transform .25s,visibility 0s .25s}
.hud-head{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:0 0 12px}
.hud-head .kicker{margin:0}
.hud-sign,.minisign{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px;border-radius:var(--r-plate);text-decoration:none;color:var(--cream);
  background:var(--enamel);border:2px solid var(--outline);box-shadow:inset 0 1px 0 var(--enamel-hi),inset 0 -3px 0 var(--enamel-lo)}
.hud-sign:hover{border-color:var(--gold)}
.ms-t{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.ms-l{font:800 11px/1.3 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--paper)}
.ms-n{font:600 13px/1.4 var(--f-ui);color:#CFE0D7}.ms-n b{color:var(--amber)}
.ms-w{display:flex;align-items:center;justify-content:center;min-width:80px;min-height:70px;padding:10px 12px;border-radius:4px;background:var(--plate-deep);box-shadow:inset 0 3px 0 rgba(0,0,0,.55)}
.ms-w svg.pix{--px:7px}.ms-w .sign-off svg.pix{--px:2px}
/* the overview's days-since tile: the number chalked on a slate in an oak frame, matching the dispatch board */
.hud-sign .ms-w{background:#26272F;border:3px solid #7A5032;border-radius:3px;box-shadow:inset 0 0 0 1px #16161C,inset 0 2px 6px rgba(0,0,0,.5),0 1px 0 #A87648;padding:6px 14px}
.hud-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 0}
.hud-stats div{display:flex;flex-direction:column;padding-top:10px;border-top:1px solid var(--hair);min-width:0}
.hud-stats dt{font:700 12.5px/1.3 var(--f-ui);color:var(--dim)}
.hud-stats dd{margin:6px 0 0;font:800 30px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--cream)}
.hud-stats dd.hc{margin-top:4px;font:600 12px/1.3 var(--f-ui);color:var(--muted)}
.hud-stats dd.rw{color:var(--gold)}
.hud-note{margin:12px 0 0;font:600 13px/1.4 var(--f-ui);color:var(--dim)}
.hud .seg{display:flex;margin:16px 0 0}.hud .seg-b{flex:1 1 0;min-width:0;padding:0 4px;min-height:40px}
.hud-rooms ul{list-style:none;margin:16px 0 0;padding:12px 0 0;border-top:1px solid var(--hair);display:grid;grid-template-columns:1fr 1fr;gap:4px}
.hud-rooms a{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 8px;border-radius:var(--r-ctl);text-decoration:none;color:var(--cream);font:700 13px/1.2 var(--f-ui)}
.hud-rooms a:hover{background:var(--plate-hi);color:var(--amber)}
.hud-rooms kbd{font:800 10px/1 var(--f-ui);color:var(--plate-deep);background:var(--gold);border-radius:2px;padding:2px 4px}
.selfnote{display:inline-flex;flex-wrap:wrap;align-items:center;gap:0 8px;font:600 13px/1.4 var(--f-ui);color:var(--amber)}
.selfnote .btn-text{min-height:32px;font-size:12px}
@media (pointer:coarse){.selfnote .btn-text,.hud-rooms a{min-height:44px}}

/* ---------- data panels: a room's records docked beside it (desktop) or in a sheet below it (phones) ----------
   One system (tools/stats_office/DESIGN.md, "Data panels"): the header (room, one-line purpose, status, period),
   the headline (one to three key numbers, each with a plain label and what it is out of), then collapsible
   groups. Spacing on 8 (4 for hairline nudges), Open Sans only, tabular figures for every number. */
:root{--s1:8px;--s2:16px;--s3:24px;--s4:32px;--bodyPad:16px;--grpPad:20px}
.side{position:absolute;z-index:12;right:0;top:0;bottom:0;width:var(--sideW,460px);display:flex;flex-direction:column;
  background:var(--plate-deep);border-left:1px solid var(--plate-line);box-shadow:-8px 0 24px rgba(0,0,6,.45)}
@media (max-width:1199px){.side{--sideW:420px}}
.side[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.side:not([hidden]){animation:sideIn .4s cubic-bezier(.2,.7,.2,1)}}
@keyframes sideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.side-head{flex:none;padding:20px 24px 16px;background:var(--plate);border-bottom:1px solid var(--plate-line)}
.sh-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.sh-t{min-width:0}
.side-head .kicker{margin:0 0 4px;font-size:11px}
.side-head h1{margin:0;font:800 26px/1.15 var(--f-ui);color:var(--cream)}
.sh-purpose{margin:8px 0 0;font:400 14px/1.45 var(--f-ui);color:var(--dim)}
.sh-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:12px 0 0;min-height:20px}
.sh-meta .sh-floor{display:none;font:700 12px/1.2 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.side-head .seg{display:flex;margin:12px 0 0}.side-head .seg-b{flex:1 1 0;min-width:0;padding:0 4px;min-height:40px;font-size:12.5px}
.zoomout{min-height:40px;padding:0 12px;font-size:12px;gap:8px;white-space:nowrap;flex:none}.zoomout span[aria-hidden]{font-size:20px;line-height:1}
.selfrow{display:flex;margin:12px 0 0;padding:4px 12px;border-radius:var(--r-ctl);background:rgba(255,204,102,.07);border:1px solid rgba(255,204,102,.26)}
.selfrow .selfnote{font-size:13px}
.side-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:var(--bodyPad) var(--bodyPad) 24px}
.docs{display:flex;flex-direction:column;gap:12px}
.side-nav{display:flex;justify-content:space-between;gap:12px;margin:16px 0 0;padding:8px 0 0;border-top:1px solid var(--hair)}
.sheet-grip{display:none}

/* the headline: the room's one to three key numbers (the one gold-rimmed plate in the panel) */
.hero{padding:20px;border-radius:var(--r-plate);background:var(--plate);border:1px solid var(--plate-line);box-shadow:var(--shadow)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 0 16px;min-height:40px}
.hero-cap{margin:0;font:800 11.5px/1.3 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));grid-template-rows:auto auto auto auto;margin:0}
/* each figure spans the four rows (label, number, what it counts, comparison) of a shared subgrid, so numbers line up when a label wraps */
.kpi{display:grid;grid-row:span 4;grid-template-rows:subgrid;align-content:start;min-width:0;padding:0 12px;border-left:1px solid var(--hair);container-type:inline-size}
.kpi:first-child{padding-left:0;border-left:0}.kpi:last-child{padding-right:0}
.kpi dt{align-self:end;font:700 13px/1.3 var(--f-ui);color:var(--dim)}
.kpi .v{align-self:start;margin:8px 0 0;font:800 clamp(24px,31cqi,40px)/1 var(--f-ui);font-variant-numeric:tabular-nums lining-nums;color:var(--cream);white-space:nowrap}
.kpi .v small{font:700 14px/1 var(--f-ui);color:var(--dim);margin-left:2px}
.kpi.txt .v{font-size:clamp(16px,15cqi,20px);line-height:1.2;white-space:normal;overflow-wrap:anywhere}
.kpi.reward .v,.kpi.you .v{color:var(--gold)}
.kpi .ctx{margin:6px 0 0;font:600 12.5px/1.4 var(--f-ui);color:var(--muted)}
.kpi .ctx b{color:var(--dim);font-weight:700}
.kpi .cmp{margin:6px 0 0;font:700 12.5px/1.3 var(--f-ui);color:var(--dim);font-variant-numeric:tabular-nums}
.fine{display:flex;align-items:flex-start;gap:8px;margin:16px 0 0;font:600 12.5px/1.45 var(--f-ui);color:var(--dim)}
.fine .i{flex:none;display:inline-grid;place-items:center;width:16px;height:16px;margin-top:1px;border-radius:50%;border:1.5px solid currentColor;font:800 10px/1 var(--f-ui);font-style:normal}
.yourres{display:flex;flex-direction:column;gap:2px;margin:16px 0 0;padding:8px 12px;border-radius:4px;background:rgba(242,194,48,.10);border-left:3px solid var(--gold);font:700 14px/1.4 var(--f-ui);color:var(--cream)}
.yourres small{font:600 12.5px/1.4 var(--f-ui);color:var(--dim)}

/* groups: the secondary records, each a quiet plate that folds */
.grp{border-radius:var(--r-plate);background:var(--plate);border:1px solid var(--hair)}
.grp>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:52px;padding:4px 16px 4px var(--grpPad);cursor:pointer;border-radius:var(--r-plate);transition:background-color var(--t-press) var(--ease)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary:hover{background:var(--plate-hi)}
.grp[open]>summary{border-radius:var(--r-plate) var(--r-plate) 0 0}
.grp-t{flex:1;min-width:0;margin:0;font:800 16px/1.3 var(--f-ui);color:var(--cream)}
.grp-m{font:600 13px/1.2 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.chev{flex:none;width:9px;height:9px;margin:0 4px 4px 0;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);transition:transform var(--t-press) var(--ease)}
.grp[open]>summary .chev{transform:translateY(4px) rotate(-135deg)}
@media (prefers-reduced-motion:reduce){.chev,.grp>summary{transition:none}}
.grp-b{padding:4px var(--grpPad) var(--grpPad)}
.grp-sub{margin:0 0 16px;font:400 14px/1.5 var(--f-ui);color:var(--dim)}
.quiet{margin:0;font:600 14px/1.5 var(--f-ui);color:var(--dim)}
.grp a{color:var(--teal);text-underline-offset:3px}.grp a:hover{color:var(--amber)}

/* states: one block for empty, failed and loading in every room */
.state{display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;padding:16px;border-radius:var(--r-plate);background:var(--plate);border:1px dashed rgba(244,239,230,.2)}
.state p{margin:0;flex:1 1 200px;font:600 14px/1.5 var(--f-ui);color:var(--dim)}
.state p b{display:block;color:var(--cream)}
.state .ico{opacity:.8}
.state.err{border-color:rgba(229,72,77,.5)}
.btn-plate.sm{min-height:40px;padding:0 14px;font-size:12px}
@media (pointer:coarse){.btn-plate.sm{min-height:44px}}
.skel-block{display:block;margin:0 0 12px;border-radius:4px;background:linear-gradient(90deg,rgba(244,239,230,.05),rgba(244,239,230,.10),rgba(244,239,230,.05));background-size:200% 100%}
.skel-grp{padding:16px var(--grpPad) 8px}
@media (prefers-reduced-motion:no-preference){.skel-block,.skel{animation:shimmer 1.4s linear infinite}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.skel{background-size:200% 100%!important}

/* rows: a label, its number and where it lives (dispatch's ledger, fixed windows, the incident report) */
.ledger{list-style:none;margin:0 calc(var(--grpPad) * -1);padding:0}
.ledger a{display:grid;grid-template-columns:minmax(0,1fr) auto 20px;align-items:center;gap:0 12px;min-height:56px;padding:8px var(--grpPad);border-top:1px solid var(--hair);text-decoration:none;color:var(--cream)}
.ledger .lk{grid-column:1;grid-row:1;font:700 15px/1.3 var(--f-ui)}
.ledger .lr{grid-column:1;grid-row:2;font:600 12.5px/1.3 var(--f-ui);color:var(--teal)}
.ledger b{grid-column:2;grid-row:1/3;font:800 22px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.ledger .arr{grid-column:3;grid-row:1/3;color:var(--teal);font-size:18px}
.ledger a:hover{background:var(--plate-hi)}.ledger a:hover .lr,.ledger a:hover .arr{color:var(--amber)}
.rows{margin:0;display:grid}
.rows div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-top:1px solid var(--hair)}
.rows div:first-child{border-top:0;padding-top:4px}
.rows dt{font:600 14px/1.3 var(--f-ui);color:var(--dim)}
.rows dd{margin:0;font:800 18px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--cream);text-align:right}
.rows dd small{font:600 12.5px/1 var(--f-ui);color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:12px;margin:0}
.mini div{display:flex;flex-direction:column;gap:4px;min-width:0;padding:12px;border-radius:4px;background:var(--plate-deep)}
.mini dt{order:2;font:600 12.5px/1.35 var(--f-ui);color:var(--dim)}
.mini dd{order:1;margin:0;font:800 22px/1.1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--cream);overflow-wrap:anywhere}
.mini dd.sm{font-size:16px;line-height:1.25}
.mini .you dd{color:var(--gold)}

/* bars: label and number on one line, the track under them, what it is out of beside the number */
.bars{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:6px 12px}
.bars .bl{font:600 14px/1.3 var(--f-ui);color:var(--cream);min-width:0}
.bars .bv{font:600 13px/1 var(--f-ui);color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bars .bv b{font:800 17px/1 var(--f-ui);color:var(--cream)}
.bars .bv em{font-style:normal;font-weight:700;color:var(--dim);margin-left:4px}
.bars .tr{grid-column:1/-1;height:8px;border-radius:2px;background:rgba(244,239,230,.07);overflow:hidden}
.bars .tr i{display:block;height:100%;border-radius:2px;background:var(--c1)}
.bars .bn{grid-column:1/-1;margin-top:-2px;font:600 12.5px/1.4 var(--f-ui);color:var(--muted)}
.bars li.zero .bl{color:var(--dim)}
.bars li.rw .tr i{background:linear-gradient(90deg,var(--orange),var(--gold))}
.bars li.you .tr{box-shadow:inset 0 0 0 1px var(--gold)}
.bars.mugbars li{grid-template-columns:40px minmax(0,1fr) auto;column-gap:12px}
.bars.mugbars .mugs{grid-column:1;grid-row:1/4;align-self:start}
.bars.mugbars .bl{grid-column:2;grid-row:1}.bars.mugbars .bv{grid-column:3;grid-row:1}
.bars.mugbars .tr{grid-column:2/-1;grid-row:2}.bars.mugbars .bn{grid-column:2/-1;grid-row:3}
.mugs{width:40px;height:50px;background:url(a/suspects.e79f34fab3.webp) no-repeat;background-size:240px 50px;image-rendering:pixelated;border-radius:3px;background-color:var(--plate-deep)}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:16px 0 0;padding:12px 0 0;border-top:1px solid var(--hair);font:600 13px/1.3 var(--f-ui);color:var(--dim)}
.tot b{font:800 17px/1 var(--f-ui);color:var(--cream);font-variant-numeric:tabular-nums}

/* in-world marks, used sparingly: one stamp system (same size, border, tilt and centred caps everywhere) */
.stamp{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-width:72px;margin:0;padding:4px 10px 3px;border:2px solid currentColor;border-radius:3px;transform:rotate(-3deg);
  font:800 12px/1.2 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);opacity:.92;text-indent:.16em;white-space:nowrap}
.stamp.hot,.stamp.caged{color:#F07C6C}
.stamp.free{color:var(--gold)}
.stamp.sealed{color:var(--muted)}
.stamp.sm{min-width:0;padding:2px 6px 1px;border-width:1.5px;font-size:10px;letter-spacing:.12em;text-indent:.12em}
.yours{display:inline-block;font:800 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--plate-deep);padding:4px 6px;border-radius:3px;vertical-align:middle;white-space:nowrap}
.rk{display:inline-block;font:800 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(255,204,102,.5);padding:3px 5px;border-radius:3px;white-space:nowrap}
.fieldnote{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:16px 0 0;font:italic 400 14px/1.5 var(--f-ui);color:var(--amber)}
.fieldnote .paw{width:12px;height:10px;opacity:1;margin:0;align-self:center;fill:var(--amber)}
.fieldnote small{font:700 11px/1 var(--f-ui);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wanted{display:flex;gap:16px;align-items:flex-end}
.wanted-art{flex:none;display:flex;justify-content:center;width:132px;padding:12px 0 4px;border-radius:4px;background:var(--plate-deep)}
.jimstill{display:block;background-repeat:no-repeat;background-position:0 0;image-rendering:pixelated}
.memo{display:flex;align-items:center;gap:16px;margin:4px 0 0;padding:12px 16px;border-radius:var(--r-plate);border:1px dashed rgba(244,239,230,.16);font:600 13px/1.45 var(--f-ui);color:var(--dim)}
.memo b{color:var(--cream)}
.memo .stamp{flex:none}

/* charts: one time-series component; the key above the plot names each series and reads its value */
.chart{min-width:0}
.ch-key{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:0 0 12px}
.ch-at{flex-basis:100%;font:700 12.5px/1.3 var(--f-ui);color:var(--dim)}
.k{display:inline-flex;align-items:center;gap:8px;font:600 13px/1.2 var(--f-ui);color:var(--dim);white-space:nowrap}
.k b{font:800 16px/1 var(--f-ui);color:var(--cream);font-variant-numeric:tabular-nums}
.k i{display:inline-block;width:18px;height:3px;border-radius:2px;background:var(--c1)}
.k.bar i{width:10px;height:12px;border-radius:1.5px}
.k.c1 i{background-color:var(--c1)}.k.c2 i{background-color:var(--c2)}.k.c3 i{background-color:var(--c3)}
.k.c3.dash i{background:repeating-linear-gradient(90deg,var(--c3) 0 5px,transparent 5px 8px)}
.ch-plot{position:relative;border-radius:4px;background:var(--plate-deep);padding:4px 0 0;cursor:crosshair;touch-action:pan-y}
.ch-plot:focus-visible{outline-offset:2px}
.ch-plot svg{display:block;width:100%;height:auto;overflow:visible}
.ch-plot text{font:600 12px var(--f-ui);fill:var(--muted);font-variant-numeric:tabular-nums}
.ch-plot text.vl{fill:var(--cream);font-weight:700}
.ch-plot .grid{stroke:rgba(244,239,230,.08)}
.ch-plot .base{stroke:rgba(244,239,230,.28)}
.ch-plot polyline{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-plot polyline.dash{stroke-dasharray:6 5}
.ch-plot .c1{stroke:var(--c1)}.ch-plot rect.c1,.ch-plot circle.c1{fill:var(--c1);stroke:none}
.ch-plot .c2{stroke:var(--c2)}.ch-plot rect.c2,.ch-plot circle.c2{fill:var(--c2);stroke:none}
.ch-plot .c3{stroke:var(--c3)}.ch-plot rect.c3,.ch-plot circle.c3{fill:var(--c3);stroke:none}
.ch-plot rect{opacity:.9}
.ch-plot rect.hi{opacity:1;stroke:var(--cream);stroke-width:1}
.ch-plot .guide{stroke:var(--gold);stroke-width:1;stroke-dasharray:3 3}
.ch-note{display:flex;align-items:flex-start;gap:8px;margin:10px 0 0;font:600 12.5px/1.45 var(--f-ui);color:var(--dim)}
.ch-note .mk{width:8px;height:8px;margin-top:4px;border-radius:50%;border:2px solid var(--gold);flex:none}
details.nums{margin:8px 0 0;font:400 14px/1.4 var(--f-ui)}
details.nums summary{display:inline-flex;align-items:center;min-height:44px;cursor:pointer;font:700 12px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
details.nums summary:hover{color:var(--amber)}
details.nums table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
details.nums th,details.nums td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--hair);color:var(--cream)}
details.nums th:first-child{text-align:left}
details.nums thead th{font:700 12px/1.2 var(--f-ui);color:var(--dim)}
details.nums tbody th{font-weight:600;color:var(--dim)}
.tscroll{max-height:320px;overflow:auto}

/* buttons in records: one share button per headline (it offers each number), the same in every sheet */
.sharebtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--plate-line);border-radius:var(--r-ctl);background:transparent;cursor:pointer;
  font:700 12px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--cream);transition:border-color var(--t-press) var(--ease),background-color var(--t-press) var(--ease)}

/* the gull's idle: a shuffle and a little hop, always facing the same way (a mirror flip read as an instant turn; a real
   turn would need painted three-quarter and front views, so it doesn't turn) */
@keyframes gull{0%,26%{transform:none}30%,43%{transform:translateX(1px)}45%{transform:translateX(1px) translateY(-1px)}47%,67%{transform:translateX(1px)}72%,96%{transform:translateX(-0.5px)}100%{transform:none}}

/* ---------- the boiler room's secret ---------- */
.world .egg{position:absolute;pointer-events:none}
/* the gauge, the drain and the hatch are painted in; the page adds only the needle's spike and the open hatch */
.egg.gauge{width:8px;height:8px}
.egg.gauge i{position:absolute;left:3.6px;top:1px;width:.8px;height:3px;background:#2a1a1a;transform-origin:50% 100%;transform:rotate(-40deg);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.6,1),opacity .1s}
.egg-open .egg.gauge i{opacity:1;transform:rotate(80deg)}
.egg.hatch{background-size:100% 100%;opacity:0;transform-origin:22% 50%;transform:scaleX(.35);transition:opacity .15s,transform .35s cubic-bezier(.2,1.4,.5,1)}
.egg.hatch.open{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.egg.hatch{transition:none}}
.egg.vent i{position:absolute;left:0;top:10px;width:8px;height:7px;border-radius:50%;background:rgba(225,232,245,.7);filter:blur(1px);opacity:0}
.egg.vent.puff i{animation:puff 1s ease-out both}.egg.vent.puff i:nth-child(2){animation-delay:.15s}.egg.vent.puff i:nth-child(3){animation-delay:.3s}
.egg.eyes{opacity:0}.egg.eyes i{position:absolute;top:0;width:2px;height:1.5px;border-radius:1px;background:#ff3a2a;box-shadow:0 0 2px rgba(255,40,30,.8)}
.egg.eyes i+i{left:4px}
.egg.eyes.on{opacity:1}
@media (prefers-reduced-motion:no-preference){.egg.eyes.blink{animation:eyes 3.2s steps(1) both}}
@keyframes eyes{0%{opacity:1}30%{opacity:0}34%{opacity:1}70%{opacity:1}74%{opacity:0}78%{opacity:1}100%{opacity:0}}
.egg.rat{display:none;background-size:600% 100%;pointer-events:auto;cursor:pointer}
.egg.rat.poke{display:block;background-position:0 0}
.egg.rat.run{display:block;animation:ratRun .3s steps(4) infinite;transition:left 1.4s linear}
.egg.rat.bolt{transition:left .3s ease-in}
@keyframes ratRun{from{background-position:-100% 0}to{background-position:-500% 0}}
.world .egg.hit{pointer-events:auto;padding:0;border:0;background:transparent;cursor:pointer;opacity:1}
.egg.hit:focus-visible{outline:2px solid var(--gold);outline-offset:1px;border-radius:2px}

/* sheets: the evidence report, the intake card, share and About (a dialog over the dimmed page) */
dialog{max-width:520px;width:calc(100% - 32px);max-height:calc(100% - 32px);border:0;padding:0;background:transparent;color:var(--cream);overflow:visible}

.sheet a{color:var(--teal);text-underline-offset:3px}.sheet a:hover{color:var(--amber)}

}

.world .amb.gull.away{opacity:0;animation:none}
@media (prefers-reduced-motion:no-preference){

}

@keyframes gullFly{0%{transform:none}12%{transform:translate(1px,-3px) scaleY(.9)}25%{transform:translate(8px,-14px) rotate(-8deg) scaleY(1.08)}
  40%{transform:translate(26px,-38px) rotate(-12deg) scaleY(.88)}55%{transform:translate(55px,-66px) rotate(-14deg) scale(.94,1.06)}

  80%{transform:translate(-10px,-10px) rotate(3deg) scale(.95,1.05)}92%{transform:translate(0,1px) scale(1.04,.94)}100%{transform:none}}

    i++; setTimeout(step, 1000 / m.fps);
  };
  step(); return true;
}
const gullFlightLength = kind => gullPlan(kind).length / ((KIT[kind] && KIT[kind].fps) || 12);

/* ---------- start: the toggle, the targets, the dialogs ---------- */
function playInit() {
  sndButton();
  $("sndBtn").addEventListener("click", () => {
    SND.on = !SND.on; SND.chosen = true; try { localStorage.setItem("jimothy:office:sound", SND.on ? "1" : "0"); } catch (e) {}
    sndButton();
    if (SND.on) { sndUnlock(); if (SND.ctx) { SND.ctx.resume(); setBeds(state.room); sfx("bubble", 0.4); } }
    else if (SND.ctx) { for (const b of Object.values(SND.beds)) b.g.gain.setTargetAtTime(0, SND.ctx.currentTime, 0.1); clearInterval(SND.tick); }
  });
  for (const ev of ["pointerdown", "keydown"]) addEventListener(ev, sndUnlock, {capture: true});
  const w = $("world"), live = document.createElement("div");
  live.id = "sayLive"; live.className = "vh"; live.setAttribute("role", "status"); live.setAttribute("aria-live", "polite"); document.body.appendChild(live);
  /* click targets over the figures (buttons: keyboard and screen readers reach them too) */
  const hit = (x, y, wd, ht, label, fn) => { const b = document.createElement("button"); b.type = "button"; b.className = "hit"; b.setAttribute("aria-label", label);
    Object.assign(b.style, {left: x + "px", top: y + "px", width: wd + "px", height: ht + "px"});
    b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); fn(); }); w.appendChild(b); };
  for (const s of SPRITES) if (WHO[s.k]) hit(s.x + s.w * 0.15, s.y + 4, s.w * 0.7, s.h - 8, `${NAME[WHO[s.k]]}: say something`, () => say(WHO[s.k]));
  const j = SPRITES.find(x => x.k === "jim_sneak"); if (j) hit(Math.max(0, j.x + 8), j.y + 30, 134, 62, "Jimothy: startle him", jimDash);
  hit(587, 96, 48, 42, "The gull: shoo it", gullFly);
  /* the flight's frames are fetched when a pointer comes near the gull (or the building is first touched), so it flies at once */
  const pre = () => { for (const k of ["gull_off", "gull_land"]) if (ART[k]) new Image().src = ART[k]; };
  const gh = w.querySelector('.hit[aria-label^="The gull"]'); if (gh) { gh.addEventListener("pointerenter", pre, {once: true}); gh.addEventListener("focus", pre, {once: true}); }
  w.addEventListener("pointerdown", pre, {once: true});
  hit(531, 996, 48, 30, "The opossum: startle it", possumDead);
  /* a click or tap outside a sheet closes it, like Escape (not a drag or a text selection that started inside it) */
  for (const id of ["evDlg", "eggDlg"]) {
    const d = $(id); if (!d) continue; let down = false;
    const outside = e => { const box = (d.firstElementChild || d).getBoundingClientRect();
      return e.target === d && (e.clientX < box.left || e.clientX > box.right || e.clientY < box.top || e.clientY > box.bottom); };
    d.addEventListener("pointerdown", e => { down = outside(e); });
    d.addEventListener("click", e => { if (down && outside(e) && !String(getSelection())) { e.preventDefault(); e.stopPropagation(); d.close(); } down = false; });
  }
}

/* ---------- back to the game: only when the web game opened this tab (shared/sightings_link.gd keeps the opener) ----------
   The button returns to that tab; it never starts a game. Its label follows the game's state: the game's page keeps
   window.jimothyGameState = {s: "run" | "paused" | "title", t} and mirrors it to localStorage (GAME_KEY) with a
   heartbeat; a mirror older than GAME_STALE_MS is ignored. A game build without the state still gets "Back to game".
   No opener (a fresh visit, a shared link, the desktop game's browser): no button. */
const GAME_KEY = "jimothy:game:state", GAME_STALE_MS = 30000;
function gameOpener() {
  try {
    const o = window.opener; if (!o || o.closed || o.location.origin !== location.origin) return null;
    return o.jimothyGameState || typeof o.Engine === "function" || o.document.getElementById("canvas") ? o : null;   /* the game's page, not just any page of the site */
  } catch (e) { return null; }
}
function gameState(o) {
  try { const s = o.jimothyGameState; if (s && typeof s.s === "string") return s.s; } catch (e) {}
  try { const v = JSON.parse(localStorage.getItem(GAME_KEY) || "null"); if (v && typeof v.s === "string" && typeof v.t === "number" && Date.now() - v.t <= GAME_STALE_MS) return v.s; } catch (e) {}
  return null;
}
function updateGameBtn() {
  const b = $("gameBtn"); if (!b) return;
  const o = gameOpener(); b.hidden = !o;
  if (!o) { const h = $("gameHint"); if (h) h.hidden = true; return; }
  const s = gameState(o), t = s === "run" || s === "paused" ? "Resume play" : "Back to game";
  if (b.dataset.t !== t) { b.dataset.t = t; b.querySelector(".gm-t").textContent = t; }
}
function backToGame() {
  const o = gameOpener(); if (!o) return updateGameBtn();
  try { o.postMessage({type: "jimothy:focus"}, location.origin); } catch (e) {}
  try { o.focus(); } catch (e) {}
  try { window.close(); } catch (e) {}   /* allowed for a tab the game opened with window.open */
  setTimeout(() => { if (window.closed) return; const h = $("gameHint"); if (h) { h.hidden = false; h.textContent = "Switch back to your game tab."; } }, 300);
}
$("gameBtn").addEventListener("click", backToGame);
addEventListener("storage", e => { if (e.key === GAME_KEY) updateGameBtn(); });
addEventListener("focus", updateGameBtn);
setInterval(updateGameBtn, 5000);
updateGameBtn();
/* the phone directory scrolls sideways: a soft fade at an edge says there is more that way */
(() => { const ul = $("pdirList"), nav = ul && ul.parentElement; if (!nav) return;
  const cue = () => { nav.classList.toggle("more-r", ul.scrollLeft + ul.clientWidth < ul.scrollWidth - 4); nav.classList.toggle("more-l", ul.scrollLeft > 4); };
  ul.addEventListener("scroll", cue, {passive: true}); addEventListener("resize", cue); new MutationObserver(cue).observe(ul, {childList: true}); cue(); })();
/* the painting never scrolls: focus moving to something clipped would scroll the viewport and slide the art away */
for (const id of ["vp", "app"]) $(id).addEventListener("scroll", e => { const v = e.currentTarget; if (v.scrollTop || v.scrollLeft) { v.scrollTop = 0; v.scrollLeft = 0; } });
/* a review state's numbers are made up: a fixed banner says so on every view */
if (REVIEW) $("app").insertAdjacentHTML("afterbegin", `<div class="preview-banner" role="note"><b>Preview · sample data</b><span>The "${esc(REVIEW)}" review state: made-up numbers, not real players.</span></div>`);

/* ---------- start ---------- */
state.range = parseHash().range || (RANGES.includes(store.get("jimothy:office:range")) ? store.get("jimothy:office:range") : "30");
req.range = state.range;
readYou(parseHash().you);
buildWorld();
/* nothing pops in: the building, every figure and every moving prop are loaded first, then the world fades in together
   (at most 3.5 s; a failed image does not hold it back). Loaded, not decoded: a decode can lag far behind the load (a
   headless or busy browser), and the images decode as they are drawn. Opened on a room, its painting is fetched at once
   alongside (moveCamera) and fades in over the building when it is in. */
(() => {
  const w = $("world"); w.classList.add("loading");
  const urls = new Set([ART.c1, ...SPRITES.map(s => ART[s.k]), ART.gull, ART.rat, ART.opossum, ART.blinds, ART.hatchOpen]);
  const one = u => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = u; });
  Promise.race([Promise.all([...urls].filter(Boolean).map(one)), new Promise(r => setTimeout(r, 3500))]).then(() => w.classList.remove("loading"));
})();
$("eggHit").addEventListener("click", eggOpen);
$("eggRat").addEventListener("click", e => { e.stopPropagation(); ratClick(); });
eggSchedule();
lightning();
playInit();
setTimeout(jimSneakStart, 2500);
rainInit();
/* off screen (the page scrolled on a phone), the loops pause */
if ("IntersectionObserver" in window) new IntersectionObserver(es => es.forEach(e => $("world").classList.toggle("offscreen", !e.isIntersecting))).observe($("world").parentElement);
route();
load();
})();

/* The office clock keeps Seattle time (Pacific), whatever the visitor's own zone: each hand starts at the time now
   and the CSS turns it from there (the hour hand too). Set again when the tab comes back, since timers sleep. */
function setSeattleClock() {
  const parts = new Intl.DateTimeFormat("en-US", {timeZone: "America/Los_Angeles", hour: "numeric", minute: "numeric", second: "numeric", hourCycle: "h23"}).formatToParts(new Date());
  const v = t => +(parts.find(p => p.type === t) || {value: 0}).value;
  const h = v("hour") % 12, m = v("minute"), sec = v("second");
  for (const c of document.querySelectorAll(".prop.clock")) {
    const set = (sel, deg) => { const e = c.querySelector(sel); if (e) { e.style.setProperty("--a", deg.toFixed(2) + "deg"); e.style.animation = "none"; void e.offsetWidth; e.style.animation = ""; } };
    set(".hr", (h + m / 60 + sec / 3600) * 30);
    set(".mn", (m + sec / 60) * 6);
    set(".sc", sec * 6);
  }
}
setSeattleClock();
document.addEventListener("visibilitychange", () => { if (!document.hidden) setSeattleClock(); });
