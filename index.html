<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Jimothy: Rain City Rumble</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-retry {
	display: none;
	margin-top: 1rem;
	padding: 0.6rem 1.6rem;
	font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
	color: #fff0cc;
	background: #5b3943;
	border: 1px solid #9b3943;
	border-radius: 0.5rem;
	cursor: pointer;
	z-index: 1;
}
#status-retry:hover { background: #6d4450; }
#status-retry:focus-visible { outline: 2px solid #fff0cc; outline-offset: 2px; }

#status-detail {
	display: block;
	margin-top: 0.6rem;
	font-size: 11px;
	opacity: 0.6;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		#status-start {
	position: absolute;
	bottom: calc(10% - 34px);
	width: 100%;
	text-align: center;
	color: #fff0cc;
	font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
	opacity: 0;
	transition: opacity 0.6s;
	animation: jim-pulse 1.8s ease-in-out infinite;
}
@keyframes jim-pulse { 50% { color: #8a7d60; } }
		/* The version shows where the prompt will be while loading; once the
		   gauge is full the two alternate there, three seconds each. */
		#status-version {
	position: absolute;
	bottom: calc(10% - 34px);
	width: 100%;
	text-align: center;
	color: #8a7d60;
	font: 13px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
	letter-spacing: 0.08em;
	transition: opacity 0.4s;
}
/* The level loading note (Scenes.go_to calls window.jimothyLoading): over the
   game's black while a level is built and warmed up. Its paw prints step by
   on a CSS animation (opacity only), which the browser runs off the main
   thread, so they keep walking through the long frames of a first visit. */
#jim-loading {
	position: absolute;
	left: 0;
	right: 0;
	bottom: calc(12% + env(safe-area-inset-bottom, 0px));
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 10px;
	color: #c9bb93;
	font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
	letter-spacing: 0.08em;
	opacity: 0;
	transition: opacity 0.35s;
	pointer-events: none;
	z-index: 2;
}
#jim-loading.on { opacity: 1; }
#jim-loading .paws { display: flex; gap: 10px; height: 20px; }
#jim-loading .paw {
	width: 14px;
	height: 14px;
	opacity: 0.15;
	animation: jim-step 1.6s ease-in-out infinite;
}
#jim-loading .paw:nth-child(even) { margin-top: 6px; }
#jim-loading .paw:nth-child(2) { animation-delay: 0.2s; }
#jim-loading .paw:nth-child(3) { animation-delay: 0.4s; }
#jim-loading .paw:nth-child(4) { animation-delay: 0.6s; }
#jim-loading .paw:nth-child(5) { animation-delay: 0.8s; }
@keyframes jim-step { 0%, 100% { opacity: 0.15; } 25% { opacity: 0.95; } 60% { opacity: 0.15; } }
@media (prefers-reduced-motion: reduce) { #jim-loading .paw { animation: none; opacity: 0.6; } }
/* Portrait on a phone or tablet: the game is a landscape surface, so a
   portrait viewport letterboxes it to a sliver (the controls panel
   unreadably small). A gentle overlay asks for the device turned sideways;
   "Play anyway" dismisses it for the session. Landscape never sees it. */
#jim-rotate {
	position: fixed;
	inset: 0;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 18px;
	padding: 24px 16px;
	box-sizing: border-box;
	background: rgba(14, 12, 20, 0.94);
	color: #f2e6c4;
	font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
	text-align: center;
	z-index: 5;
}
#jim-rotate .phone {
	width: 44px;
	height: 72px;
	border: 3px solid #f2c230;
	border-radius: 8px;
	animation: jim-turn 2.4s ease-in-out infinite;
}
#jim-rotate .small { color: #c9bb93; font-size: 14px; max-width: 300px; }
#jim-rotate button {
	margin-top: 6px;
	padding: 10px 20px;
	border: 1px solid #f2c230;
	border-radius: 6px;
	background: transparent;
	color: #f2c230;
	font: inherit;
	font-size: 15px;
}
@keyframes jim-turn { 0%, 30% { transform: rotate(0deg); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
@media (prefers-reduced-motion: reduce) { #jim-rotate .phone { animation: none; transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) {
	body:not(.jim-rotate-dismissed) #jim-rotate { display: flex; }
}
</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>#status-progress{appearance:none;-webkit-appearance:none;height:6px;border:none;border-radius:3px;background:#1d1a14;accent-color:#f2c230;}#status-progress::-webkit-progress-bar{background:#1d1a14;border-radius:3px;}#status-progress::-webkit-progress-value{background:#f2c230;border-radius:3px;}#status-progress::-moz-progress-bar{background:#f2c230;border-radius:3px;}</style>
	</head>
	<body>
		<canvas id="canvas" aria-label="Jimothy: Rain City Rumble game">
			Jimothy: Rain City Rumble is a game played in this window; it needs JavaScript and WebGL to run.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice" role="alert"></div>
			<button id="status-retry" type="button">Retry</button>
			<div id="status-version">v0.9.56</div>
			<div id="status-start">Click or press any key or button to start</div>
		</div>

		<div id="jim-rotate" role="dialog" aria-label="Turn your device sideways">
			<div class="phone" aria-hidden="true"></div>
			<div>Turn your device sideways to play</div>
			<div class="small">Jimothy plays in landscape. Sideways, the game and its controls fill the screen.</div>
			<button type="button" onclick="document.body.classList.add('jim-rotate-dismissed')">Play anyway</button>
		</div>

		<div id="jim-loading" aria-live="polite">
			<div class="paws" aria-hidden="true"></div>
			<div class="text"></div>
		</div>
		<script>
			window.jimothyShell = true;
			// Level loading note: five paw prints (a pad and four toes, in the
			// HUD's warm cream), stepping left to right.
			(function () {
				const box = document.getElementById('jim-loading');
				const paw = '<svg class="paw" viewBox="0 0 14 14"><g fill="#e8d9ae"><ellipse cx="7" cy="9.3" rx="3.3" ry="2.9"/><circle cx="2.6" cy="5.4" r="1.4"/><circle cx="5.3" cy="3.1" r="1.4"/><circle cx="8.7" cy="3.1" r="1.4"/><circle cx="11.4" cy="5.4" r="1.4"/></g></svg>';
				box.querySelector('.paws').innerHTML = paw.repeat(5);
				window.jimothyLoading = function (on, text) {
					if (text) box.querySelector('.text').textContent = text;
					box.classList.toggle('on', !!on);
				};
			}());
			// tools/export.sh writes the version in; without it (a dev export) show nothing.
			const versionTag = document.getElementById('status-version');
			if (versionTag.textContent.includes('__')) versionTag.textContent = '';
			// The performance overlay (?perf=1, autoload/perf.gd) only: count the
			// music's audio underruns. The single-threaded build mixes the
			// streamed sound on the page's main thread and hands it to the audio
			// worklet, which reports each block it plays; when a long frame keeps
			// the main thread busy past the buffer, the worklet plays silence and
			// reports nothing. Output played = reported blocks; the clock minus
			// that is the silence, so its rise (taken as the lowest value over
			// the last second, which ignores reports still queued behind a
			// frame) is the time lost to underruns.
			if (/[?&]perf=/.test(location.search) && window.AudioWorkletNode) {
				const Orig = window.AudioWorkletNode;
				const st = { ctx: null, ch: 2, played: 0, start: -1, base: null, mins: [], cur: Infinity, at: 0 };
				window.AudioWorkletNode = class extends Orig {
					constructor(ctx, name, opts) {
						super(ctx, name, opts);
						if (name !== 'godot-processor') return;
						st.ctx = ctx;
						st.ch = (opts && opts.outputChannelCount && opts.outputChannelCount[0]) || 2;
						this.port.addEventListener('message', (e) => {
							const d = e.data;
							if (!d || d.cmd !== 'read') return;
							const now = ctx.currentTime;
							if (st.start < 0) st.start = now;
							st.played += d.data / st.ch;
							st.cur = Math.min(st.cur, (now - st.start) * ctx.sampleRate - st.played);
							if (now - st.at >= 0.25) {
								st.at = now;
								st.mins.push(st.cur);
								st.cur = Infinity;
								if (st.mins.length > 4) st.mins.shift();
								const low = Math.min.apply(null, st.mins);
								if (st.base === null && st.mins.length === 4) st.base = low;
							}
						});
					}
				};
				// Milliseconds of output lost to underruns so far, and the buffer.
				window.jimothyAudioGap = () => {
					if (!st.ctx || st.base === null) return 0;
					return Math.max(0, (Math.min.apply(null, st.mins) - st.base) / st.ctx.sampleRate * 1000);
				};
			}
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":91582672,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusRetry = document.getElementById('status-retry');

	statusRetry.addEventListener('click', function () { window.location.reload(); });

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		setStatusNotice(typeof err === 'string' ? err : 'An unknown error occurred.');
		setStatusMode('notice');
		initializing = false;
	}

	function displayLoadFailure(err) {
		console.error(err);
		let detail;
		if (err instanceof Error) {
			detail = err.message;
		} else if (typeof err === 'string') {
			detail = err;
		} else {
			detail = 'An unknown error occurred.';
		}
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		statusNotice.appendChild(document.createTextNode("Couldn't load the game. Check your connection and try again."));
		const small = document.createElement('small');
		small.id = 'status-detail';
		small.textContent = detail;
		statusNotice.appendChild(small);
		setStatusMode('notice');
		statusRetry.style.display = 'block';
		statusRetry.focus();
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			// Jimothy: the gauge stays where it is, full,
			// and the start prompt fades in under it; the first click or key
			// (which also reaches the game, unlocking its sound) fades the
			// loader away. No second screen.
			statusProgress.value = 1;
			statusProgress.max = 1;
			// Once full, the start prompt and the version take turns in the
			// same spot, three seconds each, with a soft crossfade (a dev export without a version
			// keeps the prompt up).
			const prompt = document.getElementById('status-start');
			// A phone or tablet with nothing attached says tap; a pad adds its
			// button (iPad Safari reports itself as a Mac, hence the touch check).
			const startText = () => {
				const touch = window.matchMedia('(pointer: coarse)').matches && !window.matchMedia('(any-pointer: fine)').matches;
				const pad = Array.from(navigator.getGamepads ? navigator.getGamepads() : []).some((g) => g);
				prompt.textContent = touch ? (pad ? 'Tap or press any button to start' : 'Tap to start') : 'Click or press any key or button to start';
			};
			startText();
			window.addEventListener('gamepadconnected', startText);
			window.addEventListener('gamepaddisconnected', startText);
			const version = document.getElementById('status-version');
			prompt.style.transition = version.style.transition = 'opacity 0.6s';
			let showPrompt = true;
			const flip = () => {
				prompt.style.opacity = showPrompt ? '1' : '0';
				version.style.opacity = showPrompt ? '0' : '1';
			};
			flip();
			const turns = version.textContent ? setInterval(() => { showPrompt = !showPrompt; flip(); }, 3000) : 0;
			statusOverlay.style.pointerEvents = 'none';
			const go = () => {
				clearInterval(turns);
				window.jimothyStart = null;
				window.removeEventListener('pointerdown', go, true);
				window.removeEventListener('keydown', go, true);
				statusOverlay.style.transition = 'opacity 0.5s';
				statusOverlay.style.opacity = '0';
				setTimeout(() => setStatusMode('hidden'), 520);
			};
			window.addEventListener('pointerdown', go, true);
			window.addEventListener('keydown', go, true);
			// A controller press is seen by the game, not the page: the game
			// calls this when it starts (ui/splash.gd), so the loader fades too.
			window.jimothyStart = go;
		}, displayLoadFailure);
	}
}());
		</script>
	</body>
</html>
